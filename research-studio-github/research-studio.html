    function parseRows(rows, options = {}) {
      const clean=rows.filter(r=>r&&Object.values(r).some(v=>v!==""&&v!=null));
      if(!clean.length)throw new Error("未识别到有效数据行");state.data=clean;state.cleanedData=[];state.qualityResult=null;state.results={};inferTypes(clean);state.dataHealth=assessDataHealth(clean,options);recordVersion("数据上传", `导入 ${clean.length} 行、${state.columns.length} 个变量，健康分 ${state.dataHealth.score}`);logAction("上传数据", `${clean.length} 行 × ${state.columns.length} 列 · 健康分 ${state.dataHealth.score}`, 2);markComplete("acquisition");saveState();renderPage();toast(`成功导入 ${clean.length} 行数据 · 健康分 ${state.dataHealth.score}`);
    }

    let crawlerRows = [];
    const crawlerFields = ["标题", "文本", "链接", "来源", "抓取时间"];

    function cleanCrawlerText(value) {
      return String(value ?? "").replace(/\s+/g, " ").replace(/[\u200b\ufeff]/g, "").trim();
    }

    function normalizeCrawlerUrl(value) {
      const url = new URL(String(value || "").trim());
      if (!["http:", "https:"].includes(url.protocol)) throw new Error("仅支持 http / https 网页地址");
      return url.href;
    }

    async function fetchCrawlerResponse(url) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(url, { mode: "cors", credentials: "omit", signal: controller.signal, headers: { Accept: "text/html,application/xhtml+xml,application/json,text/csv;q=0.9,*/*;q=0.7" } });
        if (!response.ok) throw new Error(`目标网页返回 HTTP ${response.status}`);
        return { text: await response.text(), type: response.headers.get("content-type") || "" };
      } finally { clearTimeout(timer); }
    }

    function crawlerRow(title, text, url, source) {
      return { "标题": cleanCrawlerText(title), "文本": cleanCrawlerText(text), "链接": url, "来源": source, "抓取时间": new Date().toLocaleString("zh-CN") };
    }

    function extractCrawlerRows(payload, url, mode = "auto") {
      const { text, type } = payload;
      const isJson = /json/i.test(type) || /\.json(?:$|\?)/i.test(url);
      const isCsv = /csv|excel|spreadsheet/i.test(type) || /\.csv(?:$|\?)/i.test(url);
      if (isCsv) {
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
        return parsed.slice(0, 200).map(row => ({ ...row, "来源": url, "抓取时间": new Date().toLocaleString("zh-CN") }));
      }
      if (isJson) {
        let parsed; try { parsed = JSON.parse(text); } catch (_) { throw new Error("网页返回的 JSON 无法解析"); }
        const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.data) ? parsed.data : [parsed]);
        return list.slice(0, 200).map((row, i) => {
          if (typeof row !== "object" || row === null) return crawlerRow(`记录 ${i + 1}`, row, url, url);
          const keys = Object.keys(row), textKey = keys.find(k => /评论|评价|内容|正文|text|content|body|description/i.test(k)) || keys.find(k => typeof row[k] === "string");
          const titleKey = keys.find(k => /标题|title|name/i.test(k));
          return crawlerRow(row[titleKey] || `记录 ${i + 1}`, row[textKey] || JSON.stringify(row), row.url || row.link || url, url);
        });
      }

      const doc = new DOMParser().parseFromString(text, "text/html");
      doc.querySelectorAll("script,style,noscript,svg,header,footer,nav,aside,form").forEach(node => node.remove());
      const pageTitle = cleanCrawlerText(doc.querySelector("title")?.textContent || doc.querySelector("h1")?.textContent || "公开网页");
      const candidates = mode === "links"
        ? [...doc.querySelectorAll("a[href]")].map(link => ({ title: cleanCrawlerText(link.textContent) || link.getAttribute("href"), text: link.getAttribute("href"), url: new URL(link.getAttribute("href"), url).href }))
        : [...doc.querySelectorAll(mode === "review" ? "[class*='comment'],[class*='review'],[class*='评论'],[class*='评价'],article,li,p" : mode === "article" ? "article,main p,main li,h1,h2,h3" : "article,[class*='comment'],[class*='review'],[class*='content'],main p,li")].map(node => ({ title: cleanCrawlerText(node.querySelector?.("h1,h2,h3,strong,b")?.textContent || pageTitle), text: cleanCrawlerText(node.textContent), url }));
      const seen = new Set(), rows = [];
      candidates.forEach(item => { const textValue = cleanCrawlerText(item.text); if (!textValue || textValue.length < 12 || textValue.length > 1800) return; const key = textValue.slice(0, 160); if (seen.has(key)) return; seen.add(key); rows.push(crawlerRow(item.title || pageTitle, mode === "links" ? textValue : textValue, item.url || url, url)); });
      if (!rows.length) {
        const bodyText = cleanCrawlerText(doc.body?.textContent || "");
        if (bodyText) rows.push(crawlerRow(pageTitle, bodyText.slice(0, 3000), url, url));
      }
      return rows.slice(0, 200);
    }

    function showCrawlerPreview(rows, message = "") {
      crawlerRows = rows || [];
      const node = document.getElementById("crawlerPreview");
      const status = document.getElementById("crawlerStatus");
      if (!node) return;
      if (!crawlerRows.length) { node.hidden = true; return; }
      node.hidden = false;
      node.innerHTML = `<div class="crawler-preview-head"><div><strong>抓取结果：${crawlerRows.length} 条</strong><span class="help" style="margin-left:8px">${esc(message || "可预览、下载或作为当前数据分析")}</span></div><div class="page-tools"><button class="btn" id="downloadCrawler"><i data-lucide="download"></i>下载 CSV</button><button class="btn btn-primary" id="useCrawler"><i data-lucide="arrow-right-to-line"></i>作为当前数据分析</button></div></div><div class="table-wrap"><table><thead><tr>${crawlerFields.map(field => `<th>${field}</th>`).join("")}</tr></thead><tbody>${crawlerRows.slice(0, 8).map(row => `<tr>${crawlerFields.map(field => `<td title="${esc(row[field])}">${esc(row[field])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${crawlerRows.length > 8 ? `<p class="help">仅展示前 8 条，完整结果可下载 CSV。</p>` : ""}`;
      document.getElementById("downloadCrawler")?.addEventListener("click", () => downloadCSV(crawlerRows, "网页抓取结果.csv"));
      document.getElementById("useCrawler")?.addEventListener("click", () => useCrawlerDataset());
      if (status) { status.textContent = `${crawlerRows.length} 条记录已准备`; status.className = "crawler-status is-success"; }
      icons();
    }

    function useCrawlerDataset() {
      if (!crawlerRows.length) return toast("暂无可导入的抓取结果");
      state.data = crawlerRows.map(row => ({ ...row })); state.cleanedData = []; state.qualityResult = null; state.results = {};
      inferTypes(state.data);state.dataHealth=assessDataHealth(state.data); recordVersion("爬虫数据", `导入 ${state.data.length} 条网页记录`); logAction("导入爬虫结果", `${state.data.length} 条`, 2); markComplete("acquisition"); saveState(); toast(`已将 ${state.data.length} 条网页记录送入分析`); renderPage();
    }

    async function runCrawler() {
      const status = document.getElementById("crawlerStatus"), input = document.getElementById("crawlerUrl"), mode = document.getElementById("crawlerMode")?.value || "auto";
      try {
        const url = normalizeCrawlerUrl(input?.value); status.textContent = "正在连接目标网页…"; status.className = "crawler-status is-loading"; document.getElementById("startCrawler").disabled = true;
        const payload = await fetchCrawlerResponse(url), rows = extractCrawlerRows(payload, url, mode);
        if (!rows.length) throw new Error("网页中没有识别到可用文本");
        state.results.crawler = { url, mode, count: rows.length, fetchedAt: new Date().toISOString(), rows }; saveState(); showCrawlerPreview(rows, `来源：${url}`); toast(`抓取完成，共 ${rows.length} 条`);
      } catch (error) {
        const message = error.name === "AbortError" ? "请求超时（15 秒），请检查网页地址或网络。" : /Failed to fetch|NetworkError|Load failed/i.test(error.message) ? "抓取被浏览器拦截：目标站点未开放 CORS、需要登录或存在反爬限制。请使用官方导出 CSV。" : error.message;
        status.textContent = message; status.className = "crawler-status is-error"; toast(message);
      } finally { const button = document.getElementById("startCrawler"); if (button) button.disabled = false; }
    }

    function handleFile(file) {
      if(!file)return;const ext=file.name.split(".").pop().toLowerCase();
      if(ext==="csv"){
        Papa.parse(file,{header:true,skipEmptyLines:true,encoding:"UTF-8",complete:r=>{try{if(r.errors.length&&r.data.length===0)throw new Error(r.errors[0].message);parseRows(r.data,{headers:r.meta.fields||[]});}catch(e){toast(e.message);}},error:e=>toast(`CSV 读取失败：${e.message}`)});
      } else {
        const reader=new FileReader();reader.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}),headers=(matrix[0]||[]).map(String),rows=matrix.slice(1).map(values=>Object.fromEntries(headers.map((header,i)=>[header||`__EMPTY_${i+1}`,values[i]??""])));parseRows(rows,{headers});}catch(err){toast(`Excel 读取失败：${err.message}`);}};reader.readAsArrayBuffer(file);
      }
    }

    function sampleSize() {
      const N=Math.max(1,Number(document.getElementById("population")?.value)||1),z=Number(document.getElementById("confidence")?.value)||1.96,e=(Number(document.getElementById("margin")?.value)||5)/100,n0=z*z*.25/(e*e),n=Math.ceil(n0/(1+(n0-1)/N)),actual=analysisData().length;
      const node=document.getElementById("sampleResult");if(node)node.innerHTML=`<div class="callout ${actual&&actual<n?"warn":""}" style="margin:8px 0 0"><i data-lucide="${actual>=n?"badge-check":"calculator"}"></i><div><strong>建议最小样本量：${n} 份</strong><p>${actual?`当前 ${actual} 份，${actual>=n?"达到建议量":"还需约 "+(n-actual)+" 份"}。`:`按最保守比例 p=0.5，并使用有限总体修正。`}</p></div></div>`;icons();return n;
    }

    function cleanData() {
      if(!state.data.length)return;const missing=document.getElementById("missingMethod").value,outlier=document.getElementById("outlierMethod").value,excludeLow=document.getElementById("excludeLow").checked,removeDup=document.getElementById("removeDup").checked,standardize=document.getElementById("standardize").checked;
      let rows=state.data.map((r,i)=>({...r,__original:i}));const lowSet=new Set((state.qualityResult?.low||[]).map(x=>x.index-1));if(excludeLow)rows=rows.filter(r=>!lowSet.has(r.__original));

      if(missing==="delete")rows=rows.filter(r=>state.columns.every(c=>r[c]!==""&&r[c]!=null));else state.columns.forEach(c=>{const vals=rows.map(r=>r[c]).filter(v=>v!==""&&v!=null);let fill;if(numericColumns().includes(c)){const nv=vals.map(num).filter(Number.isFinite);fill=missing==="mean"?mean(nv):missing==="mode"?modeOf(vals):median(nv);}else fill=modeOf(vals);rows.forEach(r=>{if(r[c]===""||r[c]==null)r[c]=fill;});});
      numericColumns().forEach(c=>{const vals=rows.map(r=>num(r[c])).filter(Number.isFinite);if(outlier!=="none"&&vals.length>4){let lo,hi;if(outlier==="iqr"){const q1=quantile(vals,.25),q3=quantile(vals,.75),iqr=q3-q1;lo=q1-1.5*iqr;hi=q3+1.5*iqr;}else{const m=mean(vals),s=sd(vals);lo=m-3*s;hi=m+3*s;}const med=median(vals);rows.forEach(r=>{const x=num(r[c]);if(Number.isFinite(x)&&(x<lo||x>hi))r[c]=med;});}if(standardize){const final=rows.map(r=>num(r[c])).filter(Number.isFinite),m=mean(final),s=sd(final)||1;rows.forEach(r=>r[`${c}_Z`]=Number.isFinite(num(r[c]))?((num(r[c])-m)/s).toFixed(4):"");}});
      rows.forEach(r=>delete r.__original);state.cleanedData=rows;if(standardize)inferTypes(rows);state.results.cleaning={original:state.data.length,final:rows.length,missing,outlier};recordVersion("数据清洗", `${state.data.length} 行处理后保留 ${rows.length} 行`, {missing,outlier,excludeLow,removeDup,standardize});logAction("执行数据清洗", `${missing} / ${outlier} / 保留 ${rows.length} 行`, 3);markComplete("quality");saveState();renderPage();toast(`清洗完成，保留 ${rows.length} 行`);

      slide=pptx.addSlide();head(slide,"研究设计与分析路线","METHOD");const steps=["数据获取","数据清洗","描述统计","信效度","假设检验","多元建模","研究结论","竞品策略"];steps.forEach((s,i)=>{const x=.7+i*1.55;slide.addShape(pptx.ShapeType.rect,{x,y:2.35,w:1.22,h:.75,rectRadius:.05,line:{color:i<4?C.teal:"C9D5D3",width:1},fill:{color:i<4?"E4F3F1":"FFFFFF"}});slide.addText(s,{x:x+.06,y:2.57,w:1.1,h:.25,fontFace:"Microsoft YaHei",fontSize:11,bold:true,color:C.dark,align:"center",margin:0});if(i<steps.length-1)slide.addText("→",{x:x+1.25,y:2.58,w:.28,h:.25,fontSize:15,color:C.muted,margin:0});});
      slide=pptx.addSlide();head(slide,"数据质量与核心分析","EVIDENCE");const secs=reportSections().slice(1,4);secs.forEach((s,i)=>{const x=.7+i*4.15;slide.addShape(pptx.ShapeType.rect,{x,y:1.65,w:3.7,h:4.65,line:{color:"DCE4E3",width:1},fill:{color:C.white}});slide.addText(s.title.replace(/^[一二三四五六七]、/,""),{x:x+.24,y:1.95,w:3.2,h:.4,fontFace:"Microsoft YaHei",fontSize:16,bold:true,color:i===1?C.coral:C.teal,margin:0});slide.addText(s.lines.map(x=>({text:`• ${x}`,options:{breakLine:true,bullet:{type:"ul"}}})),{x:x+.24,y:2.55,w:3.15,h:3.3,fontFace:"Microsoft YaHei",fontSize:11,color:C.dark,breakLine:true,margin:0.03,paraSpaceAfterPt:10,valign:"top"});});
      slide=pptx.addSlide();head(slide,"竞品加权竞争力对比","COMPETITION");const ca=competitorAnalysis(),max=Math.max(...ca.totals,10);state.competitors.names.forEach((n,i)=>{const y=1.7+i*1.03,w=ca.totals[i]/max*8.7;slide.addText(n,{x:.7,y:y+.15,w:1.7,h:.3,fontFace:"Microsoft YaHei",fontSize:12,bold:i===0,color:C.dark,margin:0});slide.addShape(pptx.ShapeType.rect,{x:2.45,y,w:9,h:.58,line:{transparency:100,color:"E3E9E8"},fill:{color:"E3E9E8"}});slide.addShape(pptx.ShapeType.rect,{x:2.45,y,w,h:.58,line:{transparency:100,color:i===0?C.teal:[C.coral,C.gold,"466D9E"][i-1]},fill:{color:i===0?C.teal:[C.coral,C.gold,"466D9E"][i-1]}});slide.addText(fmt(ca.totals[i],2),{x:11.65,y:y+.12,w:.7,h:.3,fontFace:"Microsoft YaHei",fontSize:13,bold:true,color:C.dark,margin:0,align:"right"});});
      Object.entries(chartSnapshots).slice(0,4).forEach(([id,data],i)=>{try{let s=pptx.addSlide();head(s,({radarChart:"竞品雷达图",positionChart:"竞品定位地图",descChart:"变量分布",sentimentChart:"文本情感结构"}[id]||"分析图表"),"CHART");s.addImage({data,x:1.25,y:1.55,w:10.8,h:5.35});}catch(_){}});
      slide=pptx.addSlide();head(slide,"研究结论与答辩边界","CONCLUSION");const cons=state.results.consistency||consistencyReport();slide.addText([...cons.passed.map(x=>`✓ ${x}`),...cons.issues.map(x=>`! ${x.title}：${x.detail}`)].slice(0,8).join("\n\n")||"请完成主要分析后补充结论。",{x:.85,y:1.55,w:11.6,h:4.8,fontFace:"Microsoft YaHei",fontSize:14,color:C.dark,breakLine:true,margin:.08,valign:"top"});slide.addText("结论边界：横截面数据主要支持条件相关解释，不作无依据的因果外推。",{x:.85,y:6.55,w:11.6,h:.36,fontFace:"Microsoft YaHei",fontSize:11,color:C.coral,bold:true,margin:0});
      await pptx.writeFile({fileName:"研究分析图表集.pptx"});
    }

    function exportJson() { const content=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);downloadBlob(new Blob([content],{type:"application/json;charset=utf-8"}),"研析台项目备份.json"); }

    function openRoutePrint() {
      const win=window.open("","_blank","width=1200,height=720");if(!win)return toast("浏览器拦截了新窗口");win.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>分析路线图</title><style>body{font-family:Microsoft YaHei,sans-serif;margin:0;padding:40px;color:#172324;background:#f2f5f4}h1{font-size:26px}.route{display:flex;align-items:stretch;gap:0}.step{width:130px;position:relative;padding-right:24px}.step:not(:last-child):after{content:'→';position:absolute;right:5px;top:28px;color:#899597}.node{border-top:4px solid #0c716a;background:#fff;border-left:1px solid #dce4e3;border-right:1px solid #dce4e3;border-bottom:1px solid #dce4e3;padding:14px 10px;min-height:95px}.node b{display:block;margin-bottom:6px}.node span{font-size:11px;color:#647375}@media print{body{background:#fff;padding:15mm}}</style></head><body><h1>${esc(state.topic)}</h1><p>全流程分析路线图</p><div class="route">${[["数据获取","问卷 / 公开数据"],["数据清洗","缺失 / 异常 / 去重"],["描述统计","频数 / 均值 / 分布"],["信效度","α / KMO / EFA"],["假设检验","t / ANOVA / 相关"],["多元建模","回归 / 聚类 / PCA"],["研究结论","假设闭环 / 稳健性"],["竞品策略","定位 / 雷达 / SWOT"]].map(s=>`<div class="step"><div class="node"><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("")}</div><script>setTimeout(()=>window.print(),400)<\/script></body></html>`);win.document.close();
    }

    async function runExport(type) {
      try{toast("正在生成文件…");if(type==="word")await exportWord();else if(type==="pdf")await exportPdf();else if(type==="print-report")openPrintableReport();else if(type==="ppt")await exportPpt();else if(type==="xlsx")exportXlsx();else if(type==="json")exportProject();else if(type==="route")openRoutePrint();else if(type==="process")exportProcessGuide();else if(type==="dictionary")exportDataDictionary();else if(type==="team")exportTeamLog();markComplete("export");logAction("导出成果", type, type==="ppt"?11:10);if(!["route","print-report"].includes(type))toast("导出已完成");}catch(e){console.error(e);toast(`导出失败：${e.message}`);}
    }

    function dependencyStatus() { return [
      ["PapaParse",!!window.Papa],["jStat",!!window.jStat],["Chart.js",!!window.Chart],["simple-statistics",!!window.ss],
      ["jsPDF",!!window.jspdf],["docx",!!window.docx],["PptxGenJS",!!window.PptxGenJS],["pdf.js",!!window.pdfjsLib],
      ["JSZip",!!window.JSZip],["pdf-lib",!!window.PDFLib],["FileSaver",!!window.saveAs],["html2canvas",!!window.html2canvas]
    ]; }

    async function openStorageCenter() {
      const estimate=await storageEstimate(),usage=estimate.usage||0,quota=estimate.quota||0,pct=quota?usage/quota*100:0,deps=dependencyStatus(),snapshot=await idbGet("latest").catch(()=>null);
      modal("存储、离线与数据安全", `<div class="metric-grid"><div class="metric"><div class="metric-label">浏览器存储</div><div class="metric-value">${fmtBytes(usage)}</div><div class="metric-note">配额 ${quota?fmtBytes(quota):"浏览器未报告"}</div></div><div class="metric"><div class="metric-label">配额使用率</div><div class="metric-value">${fmt(pct,1)}%</div><div class="metric-note">${pct>80?"空间紧张，请导出备份":"当前空间充足"}</div></div><div class="metric"><div class="metric-label">IndexedDB 镜像</div><div class="metric-value">${snapshot?"可用":"暂无"}</div><div class="metric-note">${snapshot?new Date(snapshot.savedAt).toLocaleString("zh-CN"):"等待自动保存"}</div></div><div class="metric"><div class="metric-label">网络状态</div><div class="metric-value">${navigator.onLine?"在线":"离线"}</div><div class="metric-note">Service Worker ${"serviceWorker" in navigator?(location.protocol.startsWith("http")?"可用":"需通过 HTTP 部署"):"不支持"}</div></div></div><div class="mini-section"><h3>依赖自检</h3><div class="dependency-grid">${deps.map(([name,ok])=>`<div class="dependency-item"><span>${name}</span><span class="tag ${ok?"good":"bad"}">${ok?"正常":"缺失"}</span></div>`).join("")}</div></div><div class="mini-section"><h3>备份与恢复</h3><div class="page-tools"><button class="btn" id="forceMirror"><i data-lucide="database-backup"></i>立即创建镜像</button><button class="btn" id="restoreMirror"><i data-lucide="history"></i>恢复 IndexedDB 镜像</button><button class="btn" id="encryptedBackup"><i data-lucide="lock-keyhole"></i>加密导出全部项目</button><button class="btn" id="encryptedRestore"><i data-lucide="key-round"></i>导入加密备份</button></div><input type="file" id="encryptedRestoreInput" accept=".rsbackup,application/json" hidden></div><div class="mini-section"><h3>清理本地数据</h3><div class="page-tools"><button class="btn" id="clearCurrentProject" style="color:var(--danger)"><i data-lucide="eraser"></i>清空当前项目分析</button><button class="btn" id="clearAllData" style="color:var(--danger)"><i data-lucide="trash-2"></i>清空全部本地数据</button></div></div>`);
      document.getElementById("forceMirror")?.addEventListener("click",async()=>{await mirrorToIndexedDB();toast("完整镜像已写入 IndexedDB");closeModal();});
      document.getElementById("restoreMirror")?.addEventListener("click",restoreIndexedDBSnapshot);
      document.getElementById("encryptedBackup")?.addEventListener("click",exportEncryptedBackup);
      document.getElementById("encryptedRestore")?.addEventListener("click",()=>document.getElementById("encryptedRestoreInput").click());
      document.getElementById("encryptedRestoreInput")?.addEventListener("change",e=>importEncryptedBackup(e.target.files[0]));
      document.getElementById("clearCurrentProject")?.addEventListener("click",clearCurrentProjectData);
      document.getElementById("clearAllData")?.addEventListener("click",clearAllLocalData);icons();
    }

    function bytesToBase64(bytes) { let binary="";bytes.forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary); }
    function base64ToBytes(value) { const binary=atob(value);return Uint8Array.from(binary,char=>char.charCodeAt(0)); }
    async function deriveBackupKey(password,salt) { const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
    async function exportEncryptedBackup() { const password=window.prompt("设置备份密码（至少 8 位）");if(!password||password.length<8)return toast("密码至少需要 8 位");try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveBackupKey(password,salt),plain=new TextEncoder().encode(JSON.stringify({version:APP_VERSION,appData})),encrypted=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain)),payload={format:"research-studio-encrypted",version:1,salt:bytesToBase64(salt),iv:bytesToBase64(iv),data:bytesToBase64(encrypted)};downloadBlob(new Blob([JSON.stringify(payload)],{type:"application/json"}),"研析台加密备份.rsbackup");toast("加密备份已生成，请妥善保管密码");}catch(error){toast(`加密失败：${error.message}`);} }
    async function importEncryptedBackup(file) { if(!file)return;const password=window.prompt("输入备份密码");if(!password)return;try{const payload=JSON.parse(await file.text());if(payload.format!=="research-studio-encrypted")throw new Error("不是研析台加密备份");const key=await deriveBackupKey(password,base64ToBytes(payload.salt)),plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:base64ToBytes(payload.iv)},key,base64ToBytes(payload.data)),decoded=JSON.parse(new TextDecoder().decode(plain));if(!decoded.appData?.projects?.length)throw new Error("备份中没有有效项目");if(!window.confirm(`将恢复 ${decoded.appData.projects.length} 个项目并覆盖当前数据，是否继续？`))return;appData=decoded.appData;state=mergeState(currentProject().state);saveState();closeModal();renderNav();renderPage();toast("加密备份已恢复");}catch(error){toast(`解密失败：密码错误或文件损坏`);} }
    function clearCurrentProjectData() { if(!window.confirm("清空当前项目的数据、结果和版本吗？项目名称与团队信息会保留。"))return;const project=currentProject(),fresh=mergeState({topic:state.topic});project.state=fresh;project.versions=[];project.stepMeta={};state=fresh;saveState();closeModal();renderNav();renderPage();toast("当前项目分析数据已清空"); }
    async function clearAllLocalData() { if(!window.confirm("这会删除全部项目、知识库和本地镜像，且不可撤销。是否继续？"))return;localStorage.removeItem("researchStudioAppData");localStorage.removeItem("researchStudioState");await idbClear().catch(()=>{});location.reload(); }

    function updateNetworkState() { const node=document.getElementById("networkState");if(!node)return;node.classList.toggle("offline",!navigator.onLine);node.innerHTML=`<i data-lucide="${navigator.onLine?"wifi":"wifi-off"}"></i><span>${navigator.onLine?"在线":"离线"}</span>`;icons(); }

    function showQuickGuide() {
      modal("快速引导", `<div class="grid-3"><section class="knowledge-card"><div class="question-num">1</div><h3>上传学习资料</h3><p>把优秀报告 PDF 与答辩 PPTX 放入全局资料库，提取结构、方法和配色。</p></section><section class="knowledge-card"><div class="question-num">2</div><h3>新建研究项目</h3><p>每个选题独立保存数据、参数、备注、版本和团队贡献日志。</p></section><section class="knowledge-card"><div class="question-num">3</div><h3>逐步确认分析</h3><p>按 11 步完成研究，可回退修改，并最终导出报告与答辩准备包。</p></section></div><div class="page-tools" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="guideKnowledge"><i data-lucide="library-big"></i>先上传资料</button><button class="btn btn-primary" id="guideStart"><i data-lucide="arrow-right"></i>开始使用</button></div>`);
      document.getElementById("guideKnowledge")?.addEventListener("click",()=>{appData.firstRunDone=true;saveState();closeModal();modal("全局学习资料库",knowledgeModalHtml());bindKnowledgeModal();});
      document.getElementById("guideStart")?.addEventListener("click",()=>{appData.firstRunDone=true;saveState();closeModal();});
    }

    function editUser() { modal("团队身份", `<div class="form-group"><label>当前操作人用户名</label><input id="userNameInput" value="${esc(appData.user || "本机用户")}" placeholder="例：张同学"></div><p class="help">此名称会记录到步骤操作人、版本历史和团队贡献日志。</p><button class="btn btn-primary" id="saveUserName"><i data-lucide="save"></i>保存</button>`); document.getElementById("saveUserName")?.addEventListener("click",()=>{appData.user=document.getElementById("userNameInput").value.trim()||"本机用户";saveState();closeModal();toast("操作人已更新");}); }

    document.getElementById("loadDemoTop").addEventListener("click",loadDemo);

    document.getElementById("exportQuick").addEventListener("click",()=>exportProject());

    document.getElementById("projectSwitcher").addEventListener("click",openProjectManager);
    document.getElementById("newProjectBtn").addEventListener("click",createNewProject);
    document.getElementById("openKnowledge").addEventListener("click",()=>{modal("全局学习资料库",knowledgeModalHtml());bindKnowledgeModal();});

    document.getElementById("knowledgeImportInput").addEventListener("change",e=>{importKnowledgeFile(e.target.files[0]);e.target.value="";});
    document.querySelector(".user-avatar").addEventListener("click",editUser);
    document.getElementById("starProject").addEventListener("click",e=>{e.currentTarget.classList.toggle("active");toast(e.currentTarget.classList.contains("active")?"项目已加入收藏":"已取消收藏");});
    document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const q=e.currentTarget.value.trim().toLowerCase();if(!q)return;const match=NAV.find(item=>item.label.toLowerCase().includes(q)||item.id.includes(q));if(match){navigate(match.id);e.currentTarget.blur();}else toast("没有匹配的研究模块");});
    window.addEventListener("beforeunload",saveState);
    window.addEventListener("online",updateNetworkState);window.addEventListener("offline",updateNetworkState);
    window.navigate=navigate;window.loadDemo=loadDemo;window.closeModal=closeModal;window.downloadChart=downloadChart;

    if(!state.topicAnalysis&&state.completed.includes("planning"))state.topicAnalysis=analyzeTopic(state.topic);
    renderNav();renderPage();icons();updateNetworkState();recoverFromIndexedDBIfNeeded().finally(()=>mirrorToIndexedDB());
    if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(error=>console.warn("Service Worker 注册失败",error));
    if(!appData.firstRunDone)setTimeout(showQuickGuide,300);
  </script>
