<head>

  <title>研析台 · 调研与统计分析工作台</title>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #172324;
      --muted: #647375;
      --subtle: #899597;
      --line: #dce4e3;
      --line-strong: #c9d5d3;
      --paper: #ffffff;
      --canvas: #f2f5f4;
      --sidebar: #102b2d;
      --sidebar-soft: #18383a;
      --primary: #0c716a;
      --primary-dark: #095954;
      --primary-soft: #e4f3f1;
      --coral: #d26a4a;
      --coral-soft: #fff0eb;
      --gold: #b38324;
      --gold-soft: #fff7df;
      --blue: #466d9e;
      --blue-soft: #ebf1f8;
      --danger: #b44545;
      --danger-soft: #fbeaea;
      --success: #31765f;
      --success-soft: #e9f5ef;
      --shadow: 0 10px 30px rgba(25, 49, 48, .07);
      --radius: 7px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.62;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    a { color: var(--primary); }
    .app { min-height: 100vh; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow: hidden;
      color: #e8f1ef; background: var(--sidebar);
      display: flex; flex-direction: column; z-index: 30;
    }
    .brand {
      min-height: 88px; display: flex; align-items: center; gap: 12px;
      padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .brand-mark { width: 38px; height: 38px; border-radius: 6px; background: #e7b65d; color: #173233; display: grid; place-items: center; }
    .brand-mark svg { width: 21px; }
    .brand strong { display: block; font-family: "Noto Serif SC", serif; font-size: 18px; letter-spacing: 0; }
    .brand span { display: block; color: #9fb9b8; font-size: 11px; margin-top: 1px; }
    .project-mini { padding: 14px 18px 10px; }
    .project-mini-label { color: #8eabaa; font-size: 11px; }
    .project-mini-title { color: #f3f8f7; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .progress-line { height: 3px; background: rgba(255,255,255,.13); margin-top: 10px; overflow: hidden; }
    .progress-line > span { height: 100%; display: block; width: 7%; background: #e7b65d; transition: width .3s ease; }
    .nav-scroll { overflow-y: auto; padding: 4px 10px 20px; scrollbar-width: thin; scrollbar-color: #3d5758 transparent; }
    .nav-group-label { padding: 9px 10px 5px; color: #7f9d9c; font-size: 10px; letter-spacing: .14em; }
    .nav-item {
      width: 100%; min-height: 38px; padding: 7px 9px; border: 0; border-radius: 5px;
      background: transparent; color: #b8cbca; display: grid; grid-template-columns: 22px 1fr 18px;
      align-items: center; gap: 7px; text-align: left; transition: background .16s ease, color .16s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,.055); color: #fff; }
    .nav-item.active { background: #f0f6f5; color: #173536; font-weight: 600; }
    .nav-item svg { width: 16px; height: 16px; }
    .nav-index { font-size: 10px; opacity: .65; font-variant-numeric: tabular-nums; }
    .nav-check { color: #76c5a9; font-size: 12px; text-align: center; }
    .nav-item.active .nav-check { color: var(--primary); }
    .privacy-note { margin-top: auto; padding: 12px 18px 15px; border-top: 1px solid rgba(255,255,255,.09); color: #94aeac; font-size: 11px; display: flex; gap: 7px; align-items: flex-start; }
    .privacy-note svg { flex: 0 0 auto; width: 14px; margin-top: 2px; color: #72c2a5; }
    .workspace { min-width: 0; }
    .topbar {
      height: 64px; padding: 0 28px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 18px; position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px);
    }
    .crumb { display: flex; align-items: center; gap: 8px; color: var(--muted); min-width: 0; }
    .crumb strong { color: var(--ink); white-space: nowrap; }
    .crumb-path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .save-state { color: var(--success); font-size: 12px; display: flex; align-items: center; gap: 5px; margin-right: 4px; }
    .save-state svg { width: 14px; }
    .main { padding: 26px 28px 56px; max-width: 1500px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .eyebrow { color: var(--primary); font-size: 11px; font-weight: 700; letter-spacing: .12em; margin-bottom: 4px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-family: "Noto Serif SC", serif; font-size: 26px; line-height: 1.35; margin-bottom: 6px; letter-spacing: 0; }
    h2 { font-size: 17px; line-height: 1.45; margin-bottom: 4px; letter-spacing: 0; }
    h3 { font-size: 14px; margin-bottom: 8px; letter-spacing: 0; }
    .lead { color: var(--muted); max-width: 760px; margin: 0; }
    .page-tools { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      border: 1px solid var(--line-strong); color: var(--ink); background: var(--paper); min-height: 36px; padding: 7px 13px; border-radius: 5px;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; text-decoration: none; transition: .16s ease;
    }
    .btn:hover { border-color: #8ca5a2; background: #f8faf9; }
    .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(12,113,106,.18); outline-offset: 1px; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-accent { background: var(--coral); border-color: var(--coral); color: #fff; }
    .btn-accent:hover { background: #b9573a; border-color: #b9573a; }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
    .btn-icon { width: 36px; padding: 0; }
    .btn svg { width: 16px; height: 16px; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
    .panel-header { padding: 17px 18px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .panel-header h2, .panel-header h3 { margin: 0; }
    .panel-body { padding: 18px; }
    .split { display: grid; grid-template-columns: minmax(290px, .72fr) minmax(0, 1.45fr); gap: 18px; align-items: start; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .stack { display: grid; gap: 16px; }
    .form-group { margin-bottom: 15px; }
    .form-group:last-child { margin-bottom: 0; }
    label, .label { display: block; color: #334747; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
    input[type="text"], input[type="number"], input[type="url"], select, textarea, input[type="file"] {
      width: 100%; min-height: 38px; border: 1px solid var(--line-strong); background: #fff; border-radius: 5px; color: var(--ink); padding: 8px 10px;
    }
    textarea { min-height: 92px; resize: vertical; }
    .help { font-size: 11px; color: var(--subtle); margin-top: 5px; }
    .inline-form { display: flex; gap: 8px; align-items: end; }
    .inline-form > * { flex: 1; }
    .check-row { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); margin: 8px 0; }
    .check-row input { margin-top: 5px; accent-color: var(--primary); }
    .callout { display: flex; gap: 11px; padding: 12px 14px; border-left: 3px solid var(--primary); background: var(--primary-soft); margin-bottom: 16px; }
    .callout svg { width: 18px; flex: 0 0 auto; margin-top: 2px; color: var(--primary); }
    .callout strong { display: block; margin-bottom: 2px; }
    .callout p { margin: 0; color: #3d5c59; font-size: 12px; }
    .callout.warn { border-color: var(--gold); background: var(--gold-soft); }
    .callout.warn svg { color: var(--gold); }
    .callout.warn p { color: #695423; }
    .insight-bar { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 16px; }
    .insight-item { background: var(--paper); padding: 11px 14px; display: flex; align-items: center; gap: 9px; min-width: 0; }
    .insight-item svg { width: 16px; color: var(--primary); flex: 0 0 auto; }
    .insight-item b { font-size: 11px; color: var(--subtle); margin-right: 6px; white-space: nowrap; }
    .insight-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .metric { padding: 15px; border: 1px solid var(--line); background: var(--paper); min-height: 106px; position: relative; }
    .metric::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); }
    .metric:nth-child(2)::before { background: var(--blue); }
    .metric:nth-child(3)::before { background: var(--coral); }
    .metric:nth-child(4)::before { background: var(--gold); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { font-family: "Noto Serif SC", serif; font-size: 25px; font-weight: 700; line-height: 1.35; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
    .metric-note { color: var(--subtle); font-size: 11px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; font-size: 11px; background: #edf1f0; color: #4f6261; white-space: nowrap; }
    .tag.good { background: var(--success-soft); color: var(--success); }
    .tag.warn { background: var(--gold-soft); color: #82631d; }
    .tag.bad { background: var(--danger-soft); color: var(--danger); }
    .tag.blue { background: var(--blue-soft); color: var(--blue); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: #48605f; font-weight: 700; background: #f5f8f7; white-space: nowrap; }
    th, td { padding: 10px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:hover { background: #f9fbfa; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
    .empty svg { width: 38px; height: 38px; color: #9ab0ae; margin-bottom: 8px; }
    .chart-box { position: relative; height: 330px; width: 100%; }
    .chart-box.small { height: 260px; }
    .score-ring { --score: 82; width: 132px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--primary) calc(var(--score) * 1%), #e4eae9 0); position: relative; margin: 4px auto 16px; }
    .score-ring::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--paper); }
    .score-ring-value { position: relative; z-index: 1; text-align: center; }
    .score-ring-value strong { display: block; font-family: "Noto Serif SC", serif; font-size: 32px; line-height: 1; }
    .score-ring-value span { color: var(--muted); font-size: 10px; }
    .bar-row { display: grid; grid-template-columns: 86px 1fr 36px; gap: 9px; align-items: center; margin: 10px 0; font-size: 12px; }
    .bar-track { height: 7px; background: #e8edec; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); }
    .bar-value { text-align: right; font-variant-numeric: tabular-nums; }
    .mini-section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
    .question-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .question-num { width: 26px; height: 26px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 700; }
    .question-item p { margin: 0 0 4px; }
    .question-meta { color: var(--muted); font-size: 11px; }
    .source-list { display: grid; gap: 8px; }
    .source-item { border: 1px solid var(--line); padding: 11px; display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: start; }
    .source-item input { margin-top: 4px; accent-color: var(--primary); }
    .source-item strong { display: block; }
    .source-item p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .method-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .method-card { border: 1px solid var(--line); padding: 12px; background: #fff; text-align: left; min-height: 96px; transition: .15s ease; }
    button.method-card:hover, button.method-card.selected { border-color: var(--primary); background: var(--primary-soft); }
    .method-card strong { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .method-card p { color: var(--muted); font-size: 11px; margin: 0; }
    .pill-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .pill-tab { border: 0; border-radius: 999px; background: #e9eeed; color: #4c605f; padding: 6px 12px; }
    .pill-tab.active { background: var(--sidebar); color: #fff; }
    .route { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding-bottom: 5px; }
    .route-step { min-width: 132px; position: relative; padding-right: 24px; }
    .route-step:not(:last-child)::after { content: "→"; position: absolute; right: 7px; top: 18px; color: #98a9a7; }
    .route-node { border-top: 3px solid var(--primary); background: #f4f8f7; padding: 11px 10px; min-height: 94px; }
    .route-node b { display: block; margin-bottom: 4px; }
    .route-node span { color: var(--muted); font-size: 10px; }
    .hypothesis-row { display: grid; grid-template-columns: 44px minmax(0,1fr) 150px 115px 36px; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .hypothesis-row input, .hypothesis-row select { min-height: 34px; }
    .swot-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); }
    .swot-cell { padding: 14px; min-height: 124px; }
    .swot-cell:nth-child(1), .swot-cell:nth-child(2) { border-bottom: 1px solid var(--line); }
    .swot-cell:nth-child(odd) { border-right: 1px solid var(--line); }
    .swot-cell h3 { display: flex; align-items: center; gap: 7px; }
    .swot-cell p { margin: 0; color: var(--muted); font-size: 12px; }
    .swot-letter { width: 24px; height: 24px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .upload-zone { border: 1px dashed #95aaa7; padding: 22px; text-align: center; background: #f8faf9; }
    .upload-zone.drag { border-color: var(--primary); background: var(--primary-soft); }
    .upload-zone svg { width: 30px; color: var(--primary); }
    .timeline { border-left: 1px solid var(--line-strong); margin-left: 8px; padding-left: 18px; }
    .timeline-item { position: relative; padding-bottom: 16px; }
    .timeline-item::before { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); left: -23px; top: 7px; }
    .timeline-item strong { display: block; }
    .timeline-item p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .crawler-panel { margin-bottom: 16px; }
    .crawler-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .crawler-status { color: var(--muted); font-size: 12px; }
    .crawler-status.is-loading { color: var(--primary); }
    .crawler-status.is-error { color: var(--danger); }
    .crawler-status.is-success { color: var(--success); }
    .crawler-preview { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
    .crawler-preview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
    .crawler-preview-head strong { color: var(--ink); }
    .crawler-preview table { table-layout: fixed; }
    .crawler-preview th:first-child, .crawler-preview td:first-child { width: 25%; }
    .crawler-preview td { max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .value-note { margin-top: 18px; border-top: 1px solid var(--line); padding: 12px 2px 0; color: var(--muted); font-size: 12px; display: flex; gap: 8px; }
    .value-note svg { width: 16px; flex: 0 0 auto; color: var(--coral); margin-top: 2px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 100; background: #173536; color: #fff; padding: 11px 15px; border-radius: 5px; box-shadow: 0 12px 35px rgba(0,0,0,.2); transform: translateY(16px); opacity: 0; pointer-events: none; transition: .2s ease; max-width: 360px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(12,28,29,.56); display: none; place-items: center; z-index: 80; padding: 20px; }
    .modal-backdrop.open { display: grid; }
    .modal { background: #fff; width: min(780px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 7px; box-shadow: 0 24px 70px rgba(0,0,0,.25); }
    .modal-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; z-index: 2; }
    .modal-head h2 { margin: 0; }
    .modal-body { padding: 18px; }
    .mobile-menu { display: none; }
    .loading { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
    .loading::before { content: ""; width: 13px; height: 13px; border: 2px solid var(--line-strong); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; } }
    @media (max-width: 1050px) {
      .split { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: fixed; left: 0; transform: translateX(-100%); width: min(286px, 88vw); transition: transform .2s ease; }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: inline-flex; }
      .topbar { padding: 0 14px; }
      .main { padding: 20px 14px 42px; }
      .crumb-path, .save-state { display: none; }
      .page-head { align-items: flex-start; flex-direction: column; }

    /* Reference-inspired dashboard shell: keep the research workflow, soften the chrome. */
    :root {

    .btn { min-height: 36px; padding: 7px 12px; border-radius: 6px; color: #61738a; border-color: #dde3ec; background: #fff; box-shadow: none; }
    .btn:hover { color: var(--primary); border-color: #c9c8ff; background: #fafaff; }

    .user-avatar span { position: absolute; width: 9px; height: 9px; right: 0; bottom: 1px; border: 2px solid #fff; border-radius: 50%; background: var(--success); }
    .main { padding: 30px 26px 60px; max-width: 1600px; }
    .page-head { margin-bottom: 22px; }
    .eyebrow { color: var(--primary); font-size: 10px; letter-spacing: .13em; }
    h1 { color: #52677f; font-family: "Noto Sans SC", sans-serif; font-size: 27px; font-weight: 700; }
    h2 { color: #5a6e84; font-size: 18px; }
    h3 { color: #61758b; }

    .upload-zone { border-color: #bcc2ff; background: #fafaff; border-radius: 8px; }

    .workflow-strip { margin-bottom: 18px; padding: 14px 18px; border: 1px solid #e8eaf2; border-radius: 10px; background: #fff; box-shadow: var(--shadow); }

  <script>

      { id: "descriptive", label: "描述统计", icon: "bar-chart-3", group: "统计分析" },
      { id: "inference", label: "假设检验", icon: "scale", group: "统计分析" },

    const WORKFLOW = [
      { step: 1, label: "输入选题", page: "planning", pages: ["planning", "questionnaire"] },
      { step: 2, label: "上传数据", page: "acquisition", pages: ["acquisition"] },
      { step: 3, label: "数据清洗", page: "quality", pages: ["quality"] },
      { step: 4, label: "描述性统计", page: "descriptive", pages: ["descriptive"] },
      { step: 5, label: "假设检验", page: "inference", pages: ["inference", "hypotheses"] },
      { step: 6, label: "量表质量", page: "reliability", pages: ["reliability"] },
      { step: 7, label: "多元建模", page: "modeling", pages: ["modeling"] },
      { step: 8, label: "文本挖掘", page: "textmining", pages: ["textmining"] },
      { step: 9, label: "竞品分析", page: "competitor", pages: ["competitor"] },
      { step: 10, label: "报告生成", page: "export", pages: ["consistency", "export"] },
      { step: 11, label: "PPT 与答辩", page: "defense", pages: ["defense"] }
    ];

    const defaultState = {
      active: "planning",
      topic: "郑州市大学生奶茶消费行为及影响因素研究",
      topicAnalysis: null,
      completed: [],
      data: [],
      columns: [],
      variableTypes: {},
      cleanedData: [],
      qualityResult: null,
      hypotheses: [
        { id: "H1", text: "感知价值正向影响购买意愿", method: "多元线性回归", status: "待验证" },
        { id: "H2", text: "价格敏感度负向影响购买意愿", method: "Pearson 相关 / 回归", status: "待验证" },
        { id: "H3", text: "不同月生活费群体的月均消费存在显著差异", method: "单因素 ANOVA", status: "待验证" }
      ],
      results: {},
      questionnaire: [],
      questionnaireLogic: [],
      competitors: {
        names: ["本产品", "竞品 A", "竞品 B", "竞品 C"],
        dimensions: ["价格价值", "产品品质", "服务体验", "品牌口碑", "渠道覆盖", "创新能力"],
        weights: [15, 25, 15, 15, 10, 20],
        scores: [
          [8.2, 8.8, 8.1, 7.6, 6.8, 8.7],
          [7.6, 8.1, 7.4, 8.5, 8.8, 7.2],
          [8.8, 7.5, 7.8, 7.2, 7.6, 8.0],
          [7.2, 8.4, 8.8, 8.0, 7.0, 7.7]
        ],
        shares: [24, 31, 27, 18]
      },
      reportDraft: {},
      reportOrder: [],
      pptDraft: [],
      dataHealth: null,
      reportSettings: { template: "competition", title: "", abstract: "", keywords: "", limitations: "", references: "" }
    };

    let appData;
    let pendingKnowledgeFiles = [];
    let state = loadState();
    let charts = {};
    let chartSnapshots = {};
    let toastTimer;
    let idbLastSavedAt = null;
    let saveTimer = null;
    const APP_VERSION = "0.5.0";
    const DB_NAME = "ResearchStudioDB";
    const DB_STORE = "snapshots";

    function makeId(prefix = "item") { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }

    function mergeState(saved = {}) {
      return { ...structuredClone(defaultState), ...saved, competitors: { ...structuredClone(defaultState.competitors), ...(saved.competitors || {}) }, results: saved.results || {}, hypotheses: saved.hypotheses || structuredClone(defaultState.hypotheses), questionnaire: saved.questionnaire || [], questionnaireLogic: saved.questionnaireLogic || [], reportDraft: saved.reportDraft || {}, reportOrder: saved.reportOrder || [], pptDraft: saved.pptDraft || [], reportSettings: { ...structuredClone(defaultState.reportSettings), ...(saved.reportSettings || {}) } };
    }

    function createProject(name, initialState = null, options = {}) {
      const now = new Date().toISOString();
      const projectState = mergeState(initialState || {});
      projectState.topic = initialState?.topic || name;
      return { id: makeId("project"), name, status: options.status || "进行中", owner: options.owner || appData?.user || "未设置", note: options.note || "", tags: options.tags || [], locked: !!options.locked, currentStep: options.currentStep || 1, stepMeta: options.stepMeta || {}, logs: options.logs || [{ id: makeId("log"), time: now, user: appData?.user || "本机用户", action: "创建项目", detail: name }], versions: options.versions || [], createdAt: now, updatedAt: now, state: projectState };
    }

    function currentProject() { return appData?.projects?.find(p => p.id === appData.currentProjectId) || appData?.projects?.[0]; }

    function loadState() {
      try {
        const storedApp = JSON.parse(localStorage.getItem("researchStudioAppData") || "null");
        if (storedApp?.projects?.length) {
          appData = { version: 2, user: "本机用户", knowledge: { files: [], structures: [], methods: [], templates: [], layouts: [], colors: [] }, firstRunDone: true, ...storedApp };
          if (!appData.projects.some(p => p.id === appData.currentProjectId)) appData.currentProjectId = appData.projects[0].id;
          const project = currentProject(); project.state = mergeState(project.state); return project.state;
        }
        const saved = JSON.parse(localStorage.getItem("researchStudioState") || "null");
        appData = { version: 2, user: "本机用户", knowledge: { files: [], structures: [], methods: [], templates: [], layouts: [], colors: [] }, projects: [], currentProjectId: null, firstRunDone: false };
        const first = createProject(saved?.topic || "示例研究项目", saved ? mergeState(saved) : structuredClone(defaultState), { owner: "本机用户" });
        appData.projects.push(first); appData.currentProjectId = first.id;
        return first.state;
      } catch (e) { console.warn("无法读取本地项目", e); }
      appData = { version: 2, user: "本机用户", knowledge: { files: [], structures: [], methods: [], templates: [], layouts: [], colors: [] }, projects: [], currentProjectId: null, firstRunDone: false };
      const fallback = createProject("示例研究项目", structuredClone(defaultState)); appData.projects.push(fallback); appData.currentProjectId = fallback.id; return fallback.state;
    }

    function saveState() {
      try {
        const project = currentProject();
        if (project) { project.state = structuredClone(state); project.currentStep = workflowForPage(state.active).step; project.updatedAt = new Date().toISOString(); project.name = project.name || state.topic || "未命名项目"; }
        localStorage.setItem("researchStudioAppData", JSON.stringify(appData));
        localStorage.setItem("researchStudioState", JSON.stringify({ ...state, active: undefined }));
        document.getElementById("storageStateText")?.replaceChildren(document.createTextNode("本地已保存"));
      } catch (e) { console.warn("自动保存失败", e); document.getElementById("storageStateText")?.replaceChildren(document.createTextNode("容量不足 · 已镜像")); }
      clearTimeout(saveTimer); saveTimer=setTimeout(()=>mirrorToIndexedDB(),250);
      updateChrome();
    }

    function openDatabase() {
      return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("当前浏览器不支持 IndexedDB"));const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:"id"});};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
    }

    async function idbPut(record) { const db=await openDatabase(); return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(record);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};}); }
    async function idbGet(id) { const db=await openDatabase(); return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readonly"),req=tx.objectStore(DB_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result);};req.onerror=()=>{db.close();reject(req.error);};}); }
    async function idbClear() { const db=await openDatabase(); return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).clear();tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};}); }

    async function mirrorToIndexedDB() { try { const payload=structuredClone(appData);await idbPut({id:"latest",version:APP_VERSION,savedAt:new Date().toISOString(),payload});idbLastSavedAt=new Date();const node=document.getElementById("storageStateText");if(node)node.textContent="双层已保存";} catch(error){console.warn("IndexedDB 镜像失败",error);} }

    async function restoreIndexedDBSnapshot() { try { const record=await idbGet("latest");if(!record?.payload)throw new Error("没有可恢复的 IndexedDB 镜像");if(!window.confirm(`恢复 ${new Date(record.savedAt).toLocaleString("zh-CN")} 的完整镜像吗？`))return;appData=record.payload;if(!appData.projects?.length)throw new Error("镜像中没有项目");appData.currentProjectId=appData.currentProjectId||appData.projects[0].id;state=mergeState(currentProject().state);localStorage.setItem("researchStudioAppData",JSON.stringify(appData));closeModal();renderNav();renderPage();toast("已从 IndexedDB 恢复");}catch(error){toast(`恢复失败：${error.message}`);} }

    async function recoverFromIndexedDBIfNeeded() { if(localStorage.getItem("researchStudioAppData"))return false;try{const record=await idbGet("latest");if(!record?.payload?.projects?.length)return false;appData=record.payload;appData.currentProjectId=appData.currentProjectId||appData.projects[0].id;state=mergeState(currentProject().state);localStorage.setItem("researchStudioAppData",JSON.stringify(appData));renderNav();renderPage();toast("已自动恢复浏览器镜像");return true;}catch(error){console.warn("自动恢复镜像失败",error);return false;} }

    async function storageEstimate() { if(!navigator.storage?.estimate)return{usage:0,quota:0};return navigator.storage.estimate(); }

    function workflowForPage(page = state.active) { return WORKFLOW.find(item => item.pages.includes(page)) || WORKFLOW[0]; }

    function logAction(action, detail = "", step = workflowForPage().step) {
      const project = currentProject(); if (!project) return;
      project.logs ||= []; project.logs.unshift({ id: makeId("log"), time: new Date().toISOString(), user: appData.user || "本机用户", step, action, detail });
      project.logs = project.logs.slice(0, 200); saveState(); renderHistory();
    }

    function recordVersion(kind, description, payload = {}) {
      const project = currentProject(); if (!project) return;
      project.versions ||= []; project.versions.unshift({ id: makeId("version"), time: new Date().toISOString(), user: appData.user || "本机用户", kind, description, snapshot: { data: structuredClone(state.data || []), cleanedData: structuredClone(state.cleanedData || []), columns: [...(state.columns || [])], variableTypes: { ...(state.variableTypes || {}) }, results: structuredClone(state.results || {}), payload } });
      project.versions = project.versions.slice(0, 15); saveState();
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));
    }

    function num(value) {
      if (value === null || value === undefined || value === "") return null;
      const n = Number(String(value).replace(/[,￥%\s]/g, ""));
      return Number.isFinite(n) ? n : null;
    }

    function fmt(value, digits = 2) {
      return Number.isFinite(value) ? value.toLocaleString("zh-CN", { maximumFractionDigits: digits, minimumFractionDigits: digits }) : "—";
    }

    function pFmt(p) {
      if (!Number.isFinite(p)) return "—";
      return p < .001 ? "< 0.001" : p.toFixed(3);
    }

    function mean(values) { const v = values.filter(Number.isFinite); return v.length ? v.reduce((a,b) => a+b, 0) / v.length : NaN; }
    function variance(values) { const v = values.filter(Number.isFinite); if (v.length < 2) return NaN; const m = mean(v); return v.reduce((s,x)=>s+(x-m)**2,0)/(v.length-1); }
    function sd(values) { return Math.sqrt(variance(values)); }
    function median(values) { const v = values.filter(Number.isFinite).sort((a,b)=>a-b); if (!v.length) return NaN; const m = Math.floor(v.length/2); return v.length%2 ? v[m] : (v[m-1]+v[m])/2; }
    function quantile(values, q) { const v = values.filter(Number.isFinite).sort((a,b)=>a-b); if (!v.length) return NaN; const pos=(v.length-1)*q, base=Math.floor(pos), rest=pos-base; return v[base+1]!==undefined ? v[base]+rest*(v[base+1]-v[base]) : v[base]; }
    function covariance(a,b) { const pairs=a.map((x,i)=>[x,b[i]]).filter(v=>Number.isFinite(v[0])&&Number.isFinite(v[1])); if(pairs.length<2)return NaN; const ma=mean(pairs.map(v=>v[0])), mb=mean(pairs.map(v=>v[1])); return pairs.reduce((s,v)=>s+(v[0]-ma)*(v[1]-mb),0)/(pairs.length-1); }
    function pearson(a,b) { return covariance(a,b)/(sd(a)*sd(b)); }
    function transpose(A) { return A[0].map((_,i)=>A.map(r=>r[i])); }
    function matMul(A,B) { const BT=transpose(B); return A.map(r=>BT.map(c=>r.reduce((s,v,i)=>s+v*c[i],0))); }
    function inverse(A) {
      const n=A.length, M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);
      for(let i=0;i<n;i++){
        let p=i; for(let r=i+1;r<n;r++) if(Math.abs(M[r][i])>Math.abs(M[p][i])) p=r;
        if(Math.abs(M[p][i])<1e-10) throw new Error("矩阵不可逆，请减少高度相关变量");
        [M[i],M[p]]=[M[p],M[i]]; const d=M[i][i]; M[i]=M[i].map(x=>x/d);
        for(let r=0;r<n;r++) if(r!==i){ const f=M[r][i]; M[r]=M[r].map((x,j)=>x-f*M[i][j]); }
      }
      return M.map(r=>r.slice(n));
    }
    function determinant(A) {
      const M=A.map(r=>[...r]); let det=1;
      for(let i=0;i<M.length;i++){ let p=i; for(let r=i+1;r<M.length;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r; if(Math.abs(M[p][i])<1e-12)return 0; if(p!==i){[M[i],M[p]]=[M[p],M[i]];det*=-1;} det*=M[i][i]; const d=M[i][i]; for(let r=i+1;r<M.length;r++){const f=M[r][i]/d;for(let c=i;c<M.length;c++)M[r][c]-=f*M[i][c];}}
      return det;
    }
    function normalCdf(z) { return typeof jStat !== "undefined" ? jStat.normal.cdf(z,0,1) : .5*(1+Math.sign(z)*Math.sqrt(1-Math.exp(-2*z*z/Math.PI))); }

    function destroyCharts() {
      Object.entries(charts).forEach(([id,c]) => { try { chartSnapshots[id] = c.toBase64Image("image/png", 1); c.destroy(); } catch (_) {} });
      charts = {};
    }

    function chartColors() {
      return { teal: "#0c716a", teal2: "#6ba7a0", coral: "#d26a4a", gold: "#b38324", blue: "#466d9e", ink: "#334747", grid: "#dce4e3", soft: "#e4f3f1" };
    }

    function makeChart(id, config) {
      const canvas = document.getElementById(id);
      if (!canvas || typeof Chart === "undefined") return null;
      if (charts[id]) charts[id].destroy();
      Chart.defaults.font.family = '"Noto Sans SC", "Microsoft YaHei", sans-serif';
      Chart.defaults.color = "#647375";
      charts[id] = new Chart(canvas, config);
      return charts[id];
    }

    function downloadChart(id, name) {
      const chart = charts[id];
      if (!chart) return toast("当前图表尚未生成");
      const link = document.createElement("a");
      link.download = `${name || "分析图表"}.png`;
      link.href = chart.toBase64Image("image/png", 1);
      link.click();
    }

    function toast(message) {
      const node = document.getElementById("toast");
      node.textContent = message; node.classList.add("show"); clearTimeout(toastTimer);

    function modal(title, html) {
      document.getElementById("modalTitle").textContent = title;

    function closeModal() {

    function icons() { if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.8 } }); }

    function markComplete(id) {
      if (!state.completed.includes(id)) state.completed.push(id);

    function currentStepMeta() {
      const project = currentProject(), step = workflowForPage().step;
      project.stepMeta ||= {};
      project.stepMeta[step] ||= { status: "待复查", note: "", confirmed: false, operator: appData.user || "本机用户" };
      return project.stepMeta[step];
    }

    function completedWorkflowCount() { return WORKFLOW.filter(item => currentProject()?.stepMeta?.[item.step]?.confirmed).length; }

    function workflowShell(content) {
      const current = workflowForPage(), meta = currentStepMeta(), idx = WORKFLOW.findIndex(item => item.step === current.step), next = WORKFLOW[idx + 1], prev = WORKFLOW[idx - 1];
      const segments = WORKFLOW.map(item => `<span class="workflow-segment ${item.step === current.step ? "current" : currentProject()?.stepMeta?.[item.step]?.confirmed ? "done" : ""}" title="第${item.step}步 ${item.label}"></span>`).join("");
      return `<section class="workflow-strip"><div class="workflow-strip-head"><div><strong>项目分析流程</strong><span class="tag blue">第 ${current.step} 步 / 共 ${WORKFLOW.length} 步</span><span class="tag ${meta.status === "已确认" ? "good" : meta.status === "有问题" ? "bad" : "warn"}">${meta.status}</span></div><button class="btn btn-icon btn-ghost" id="stepHelp" aria-label="查看本步骤说明"><i data-lucide="circle-help"></i></button></div><div class="workflow-track">${segments}</div></section>${content}<section class="step-toolbar"><div class="step-toolbar-meta"><span>操作人：${esc(meta.operator || appData.user || "本机用户")}</span>${meta.note ? `<span class="note-indicator" title="已有步骤备注"></span><span>已有备注</span>` : ""}<select class="form-select step-status-select" id="stepStatus" aria-label="步骤状态"><option ${meta.status === "待复查" ? "selected" : ""}>待复查</option><option ${meta.status === "有问题" ? "selected" : ""}>有问题</option><option ${meta.status === "已确认" ? "selected" : ""}>已确认</option></select><button class="btn btn-ghost" id="stepNoteBtn"><i data-lucide="message-square-text"></i>步骤备注</button></div><div class="step-toolbar-actions"><button class="btn" id="prevStep" ${prev ? "" : "disabled"}><i data-lucide="arrow-left"></i>上一步</button><button class="btn btn-primary" id="confirmStep">${next ? "确认并继续" : "完成项目"}<i data-lucide="arrow-right"></i></button></div></section><div class="step-note-editor" id="stepNoteEditor" hidden><label for="stepNoteInput">第 ${current.step} 步备注</label><textarea id="stepNoteInput" placeholder="记录参数选择、待复查问题或团队讨论结论">${esc(meta.note || "")}</textarea><div><button class="btn btn-primary" id="saveStepNote"><i data-lucide="save"></i>保存备注</button></div></div>`;
    }

    function bindWorkflowShell() {
      const current = workflowForPage(), idx = WORKFLOW.findIndex(item => item.step === current.step), next = WORKFLOW[idx + 1], prev = WORKFLOW[idx - 1];

    function renderNav() {
      const nav = document.getElementById("navList");
      let group = ""; let html = "";

        if (item.group !== group) { group = item.group; html += `<div class="nav-group-label">${esc(group)}</div>`; }
        html += `<button class="nav-item ${state.active === item.id ? "active" : ""}" data-page="${item.id}" aria-current="${state.active === item.id ? "page" : "false"}"><i data-lucide="${item.icon}"></i><span><span class="nav-index">${String(i).padStart(2,"0")}</span> ${esc(item.label)}</span><span class="nav-check">${state.completed.includes(item.id) ? "✓" : ""}</span></button>`;
      });
      nav.innerHTML = html;
      nav.querySelectorAll("[data-page]").forEach(btn => btn.addEventListener("click", () => navigate(btn.dataset.page)));

    function navigate(id) {
      if (!NAV.some(n => n.id === id)) return;

      document.getElementById("sidebar").classList.remove("open"); window.scrollTo({ top: 0, behavior: "smooth" });

    function pageHead(step, title, desc, tools = "") {
      return `<div class="page-head"><div><div class="eyebrow">STEP ${String(workflowForPage().step).padStart(2,"0")}</div><h1>${title}</h1><p class="lead">${desc}</p></div>${tools ? `<div class="page-tools">${tools}</div>` : ""}</div>`;
    }

    function insight(scene, interpretation) {
      return `<div class="insight-bar"><div class="insight-item"><i data-lucide="circle-help"></i><b>适用场景</b><span>${scene}</span></div><div class="insight-item"><i data-lucide="lightbulb"></i><b>一句话解读</b><span>${interpretation}</span></div></div>`;
    }

    function valueNote(text) {
      return `<div class="value-note"><i data-lucide="trophy"></i><span><strong>比赛评分价值：</strong>${text}</span></div>`;
    }

    function dataReady() { return (state.cleanedData?.length || state.data?.length) > 0; }
    function analysisData() { return state.cleanedData?.length ? state.cleanedData : state.data; }
    function numericColumns() { return state.columns.filter(c => state.variableTypes[c] === "连续" || analysisData().filter(r => num(r[c]) !== null).length >= Math.max(3, analysisData().length * .75)); }
    function categoryColumns() { return state.columns.filter(c => !numericColumns().includes(c)); }
    function valuesOf(column) { return analysisData().map(r => num(r[column])).filter(Number.isFinite); }

    function renderPage() {
      const renderers = { planning: renderPlanning, questionnaire: renderQuestionnaire, acquisition: renderAcquisition, quality: renderQuality, descriptive: renderDescriptive, inference: renderInference, reliability: renderReliability, modeling: renderModeling, textmining: renderTextMining, competitor: renderCompetitor, hypotheses: renderHypotheses, consistency: renderConsistency, export: renderExport, defense: renderDefense };

    }

    function applyProjectLock() { const project=currentProject();if(!project?.locked)return;const main=document.getElementById("mainContent");main.insertAdjacentHTML("afterbegin",`<div class="callout warn"><i data-lucide="lock-keyhole"></i><div><strong>项目处于只读锁定状态</strong><p>分析参数和数据不能修改；仍可浏览并导出成果。请在项目菜单中解锁。</p></div></div>`);main.querySelectorAll("input,select,textarea").forEach(control=>control.disabled=true);main.querySelectorAll("button").forEach(button=>{const id=button.id.toLowerCase();const allowed=button.classList.contains("export-action")||/export|download|preview|route|help|prev/.test(id);if(!allowed)button.disabled=true;}); }

    function renderHistory(tab = document.querySelector(".history-tabs button.active")?.dataset.historyTab || "summary") {
      const project = currentProject(); if (!project) return;
      const node = document.getElementById("historyContent"); if (!node) return;

      if (tab === "logs") {
        const users=[...new Set((project.logs||[]).map(log=>log.user))],stepFilter=project.logFilterStep||"all",userFilter=project.logFilterUser||"all",filtered=(project.logs||[]).filter(log=>(stepFilter==="all"||String(log.step)===stepFilter)&&(userFilter==="all"||log.user===userFilter));
        node.innerHTML = `<div class="grid-2" style="margin-bottom:10px"><select id="logStepFilter"><option value="all">全部步骤</option>${WORKFLOW.map(item=>`<option value="${item.step}" ${stepFilter==item.step?"selected":""}>第${item.step}步 ${item.label}</option>`).join("")}</select><select id="logUserFilter"><option value="all">全部成员</option>${users.map(user=>`<option ${userFilter===user?"selected":""}>${esc(user)}</option>`).join("")}</select></div><div class="page-tools" style="margin-bottom:12px"><button class="btn" id="exportTeamLog"><i data-lucide="download"></i>导出贡献日志</button><button class="btn" id="exportAnalysisLog"><i data-lucide="notebook-pen"></i>导出分析日志</button></div>${filtered.length ? filtered.slice(0, 50).map(log => `<div class="history-entry"><strong>第${log.step || "—"}步 · ${esc(log.action)}</strong><p>${esc(log.detail || "无附加说明")}</p><small>${esc(log.user)} · ${new Date(log.time).toLocaleString("zh-CN")}</small></div>`).join("") : `<div class="empty"><i data-lucide="notebook-pen"></i><p>没有匹配的操作日志。</p></div>`}`;
        document.getElementById("logStepFilter")?.addEventListener("change",e=>{project.logFilterStep=e.target.value;renderHistory("logs");});document.getElementById("logUserFilter")?.addEventListener("change",e=>{project.logFilterUser=e.target.value;renderHistory("logs");});
        document.getElementById("exportTeamLog")?.addEventListener("click", exportTeamLog);
        document.getElementById("exportAnalysisLog")?.addEventListener("click", exportAnalysisLog);
      } else if (tab === "versions") {
        node.innerHTML = `<div class="page-tools" style="margin-bottom:12px"><button class="btn" id="exportVersions"><i data-lucide="download"></i>导出版本历史</button></div>${project.versions?.length ? project.versions.map((version,index) => `<div class="history-entry"><strong>${esc(version.kind)} · ${esc(version.description)}</strong><p>${esc(version.user)} · ${new Date(version.time).toLocaleString("zh-CN")}</p><p>${esc(versionDiff(version,project.versions[index+1]))}</p><button class="btn" data-rollback="${version.id}"><i data-lucide="history"></i>回退到此版本</button></div>`).join("") : `<div class="empty"><i data-lucide="git-commit-horizontal"></i><p>上传数据或调整关键参数后，这里会显示版本。</p></div>`}`;
        node.querySelectorAll("[data-rollback]").forEach(btn => btn.addEventListener("click", () => rollbackVersion(btn.dataset.rollback)));
        document.getElementById("exportVersions")?.addEventListener("click", exportVersionHistory);
      } else {
        const current = workflowForPage();
        node.innerHTML = `<div class="callout"><i data-lucide="bookmark-check"></i><div><strong>当前步骤</strong><p>第 ${current.step} 步 · ${current.label}</p></div></div>${WORKFLOW.map(item => { const meta = project.stepMeta?.[item.step]; return `<div class="history-entry"><strong>第${item.step}步 · ${item.label}</strong><p>${meta?.note ? esc(meta.note) : meta?.confirmed ? "已确认，暂无备注" : "尚未确认"}</p><small>${meta?.operator || "—"} ${meta?.status || "待复查"}</small></div>`; }).join("")}`;
      }
      icons();
    }

    function versionDiff(current,previous) { if(!previous)return"初始快照";const a=current.snapshot||{},b=previous.snapshot||{},parts=[],rowsA=a.data?.length||0,rowsB=b.data?.length||0,colsA=a.columns?.length||0,colsB=b.columns?.length||0,resA=Object.keys(a.results||{}).length,resB=Object.keys(b.results||{}).length;if(rowsA!==rowsB)parts.push(`数据行 ${rowsB}→${rowsA}`);if(colsA!==colsB)parts.push(`变量 ${colsB}→${colsA}`);if(resA!==resB)parts.push(`结果模块 ${resB}→${resA}`);return parts.join("；")||"参数或内容调整"; }

    function projectLogText(project = currentProject()) { return (project?.logs || []).map(log => `${new Date(log.time).toLocaleString("zh-CN")}\t${log.user}\t第${log.step || "—"}步\t${log.action}\t${log.detail || ""}`).join("\n"); }
    function exportTeamLog() { downloadBlob(new Blob([`团队贡献日志\n项目：${currentProject().name}\n负责人：${currentProject().owner}\n\n${projectLogText()}`], { type: "text/plain;charset=utf-8" }), "团队贡献日志.txt"); }
    function exportAnalysisLog() { const project = currentProject(), notes = WORKFLOW.map(item => { const meta = project.stepMeta?.[item.step] || {}; return `第${item.step}步 ${item.label}\n状态：${meta.status || "待复查"}\n操作人：${meta.operator || "—"}\n备注：${meta.note || "无"}`; }).join("\n\n"); downloadBlob(new Blob([`分析日志\n项目：${project.name}\n\n${notes}`], { type: "text/plain;charset=utf-8" }), "分析日志.txt"); }
    function exportVersionHistory() { const project = currentProject(), text = (project.versions || []).map(v => `${new Date(v.time).toLocaleString("zh-CN")}\t${v.user}\t${v.kind}\t${v.description}`).join("\n"); downloadBlob(new Blob([`版本历史\n项目：${project.name}\n\n${text}`], { type: "text/plain;charset=utf-8" }), "版本历史.txt"); }

    function rollbackVersion(id) {

      if (!window.confirm("回退后当前未保存的分析结果会被替换，是否继续？")) return;
      const snapshot = version.snapshot; state.data = structuredClone(snapshot.data || []); state.cleanedData = structuredClone(snapshot.cleanedData || []); state.columns = [...(snapshot.columns || [])]; state.variableTypes = { ...(snapshot.variableTypes || {}) }; state.results = structuredClone(snapshot.results || {}); recordVersion("回退", `回退到 ${version.description}`, { sourceVersion: id }); logAction("回退数据版本", version.description); renderPage(); toast("已回退到历史版本");
    }

    function projectStatusTag(status) { return `<span class="tag ${status === "已完成" ? "good" : status === "有问题" ? "bad" : status === "待定稿" ? "warn" : "blue"}">${status}</span>`; }

    function workflowForProject(project) { return WORKFLOW.find(item => item.step === (project.currentStep || 1)) || WORKFLOW[0]; }

    function bindProjectManagerModal() {
      const rerender = () => { const list = document.getElementById("projectList"); if (!list) return; let filtered = [...appData.projects]; const q = document.getElementById("projectSearch")?.value.trim().toLowerCase(); const status = document.getElementById("projectStatusFilter")?.value; if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q)); if (status && status !== "全部") filtered = filtered.filter(p => p.status === status); filtered.sort((a,b) => document.getElementById("projectSort")?.value === "name" ? a.name.localeCompare(b.name, "zh-CN") : new Date(b.updatedAt) - new Date(a.updatedAt)); list.innerHTML = renderProjectRows(filtered); bindProjectRows(); icons(); };

      document.querySelectorAll(".project-row").forEach(row => row.addEventListener("contextmenu", e => { e.preventDefault(); projectContextMenu(row.dataset.projectId); }));

    function openProjectManager() { modal("项目管理", projectManagerHtml()); bindProjectManagerModal(); }

    function createNewProject() { const next = appData.projects.length + 1, project = createProject(`选题${next}`); appData.projects.unshift(project); appData.currentProjectId = project.id; state = project.state; saveState(); logAction("创建项目", project.name); renderNav(); renderPage(); toast(`已创建 ${project.name}`); }

      const project = appData.projects.find(item => item.id === id); if (!project) return;

    function editProjectDetails(project) { modal("编辑项目属性", `<div class="form-group"><label>负责人</label><input id="editOwner" value="${esc(project.owner || "")}"></div><div class="form-group"><label>项目备注</label><textarea id="editProjectNote">${esc(project.note || "")}</textarea></div><div class="form-group"><label>自定义标签（用逗号分隔）</label><input id="editProjectTags" value="${esc((project.tags || []).map(t => t.name).join(","))}"></div><button class="btn btn-primary" id="saveProjectDetails"><i data-lucide="save"></i>保存属性</button>`); document.getElementById("saveProjectDetails")?.addEventListener("click", () => { project.owner = document.getElementById("editOwner").value.trim() || "未设置"; project.note = document.getElementById("editProjectNote").value.trim(); project.tags = document.getElementById("editProjectTags").value.split(",").map(x => x.trim()).filter(Boolean).map((name,i) => ({ name, color: ["#6d70ff", "#13b6d5", "#f57e73", "#f2a93b"][i % 4] })); project.updatedAt = new Date().toISOString(); saveState(); logAction("更新项目属性", `${project.owner} · ${project.note || "无备注"}`); closeModal(); renderNav(); renderPage(); }); }

      for (const name of slideNames) { const xml = await zip.files[name].async("text"), textCount = (xml.match(/<a:t[ >]/g) || []).length, imageCount = (xml.match(/<p:pic[ >]/g) || []).length, shapeCount = (xml.match(/<p:sp[ >]/g) || []).length; (xml.match(/(?:srgbClr|sysClr)[^>]*val="([0-9A-Fa-f]{6})"/g) || []).forEach(token => { const match=token.match(/val="([0-9A-Fa-f]{6})"/); if(match)colors.add(`#${match[1].toUpperCase()}`); }); (xml.match(/typeface="([^"]+)"/g) || []).forEach(font => fonts.add(font.replace(/typeface=\"|\"/g, ""))); layouts.push(`第 ${layouts.length + 1} 页 · ${textCount} 个文本 · ${imageCount} 张图片 · ${shapeCount} 个形状`); }

    function inferTypes(rows) {
      const cols = rows.length ? Object.keys(rows[0]) : [];
      const types = {};
      cols.forEach(c => {
        const vals = rows.map(r => r[c]).filter(v => v !== "" && v != null);
        const numericRatio = vals.length ? vals.filter(v => num(v) !== null).length / vals.length : 0;
        const unique = new Set(vals.map(String)).size;
        const name = c.toLowerCase();
        if (/意见|建议|评论|原因|开放|文本|备注|comment|text/.test(name) || (vals.some(v => String(v).length > 30) && numericRatio < .5)) types[c] = "文本";
        else if (numericRatio > .85 && unique > 8) types[c] = "连续";
        else if (numericRatio > .85 && unique <= 8) types[c] = "有序";
        else types[c] = "名义";
      });
      state.columns = cols; state.variableTypes = types;
    }

    function assessDataHealth(rows, options = {}) {
      const headers=options.headers?.length?options.headers:Object.keys(rows[0]||{}),issues=[],warnings=[],checks=[];let score=100;
      const normalized=headers.map(header=>String(header??"").trim()),duplicates=normalized.filter((header,index)=>header&&normalized.indexOf(header)!==index),emptyHeaders=normalized.filter(header=>!header||/^__EMPTY/i.test(header));
      if(duplicates.length){score-=15;issues.push(`存在重复表头：${[...new Set(duplicates)].join("、")}`);}else checks.push("表头唯一");
      if(emptyHeaders.length){score-=12;issues.push(`存在 ${emptyHeaders.length} 个空表头`);}else checks.push("表头完整");
      if(rows.length<30){score-=18;issues.push(`样本量仅 ${rows.length}，多数推断方法证据不足`);}else if(rows.length<100){score-=6;warnings.push(`样本量 ${rows.length}，复杂模型需谨慎`);}else checks.push("样本量基本充足");
      const totalCells=Math.max(1,rows.length*headers.length),missing=rows.reduce((sum,row)=>sum+headers.filter(header=>row[header]===""||row[header]==null).length,0),missingRate=missing/totalCells;
      if(missingRate>.2){score-=20;issues.push(`整体缺失率 ${fmt(missingRate*100,1)}%`);}else if(missingRate>.05){score-=8;warnings.push(`整体缺失率 ${fmt(missingRate*100,1)}%`);}else checks.push("整体缺失率较低");
      const mixed=[],constant=[],likert=[];
      headers.forEach(header=>{const values=rows.map(row=>row[header]).filter(value=>value!==""&&value!=null),numericCount=values.filter(value=>num(value)!==null).length,ratio=values.length?numericCount/values.length:0,unique=[...new Set(values.map(String))];if(values.length&&ratio>.15&&ratio<.85)mixed.push(header);if(values.length>1&&unique.length===1)constant.push(header);const numeric=values.map(num).filter(Number.isFinite);if(numeric.length>=10&&(/量表|满意|意愿|认同|态度|价值|体验|评分|q\d+/i.test(header)||new Set(numeric).size<=7)){const outside=numeric.filter(value=>value<1||value>7).length;if(outside)likert.push(`${header}(${outside})`);}});
      if(mixed.length){score-=Math.min(15,mixed.length*4);issues.push(`混合数据类型：${mixed.slice(0,6).join("、")}`);}else checks.push("变量类型一致");
      if(constant.length){score-=Math.min(10,constant.length*3);warnings.push(`常量列无法参与建模：${constant.slice(0,6).join("、")}`);}
      if(likert.length){score-=Math.min(12,likert.length*4);issues.push(`疑似量表越界：${likert.join("、")}`);}else checks.push("未发现量表范围越界");
      const duplicateRows=(()=>{const seen=new Set();let count=0;rows.forEach(row=>{const key=JSON.stringify(headers.map(header=>row[header]));if(seen.has(key))count++;else seen.add(key);});return count;})();
      if(duplicateRows){score-=Math.min(10,duplicateRows/rows.length*100);warnings.push(`发现 ${duplicateRows} 行完全重复记录`);}else checks.push("无完全重复行");
      score=Math.max(0,Math.round(score));return{score,grade:score>=85?"优秀":score>=70?"可用":score>=55?"待修复":"高风险",issues,warnings,checks,rows:rows.length,columns:headers.length,missing,missingRate,mixed,constant,likert,duplicateRows,checkedAt:new Date().toISOString()};
    }

    function seeded(seed) { let x = Math.sin(seed * 999) * 43758.5453; return x - Math.floor(x); }
    function generateDemoData(n = 128) {
      const brands = ["蜜雪冰城", "喜茶", "奈雪的茶", "茶百道"];
      const comments = ["口味不错，价格也可以接受", "新品有创意但排队时间太长", "服务很好，下次还会购买", "价格略高，优惠活动不够", "门店方便，整体体验满意", "甜度偏高，希望增加健康选项", "包装好看，很适合拍照分享", "品质稳定，但配送有时较慢"];
      const rows = [];
      for (let i=0;i<n;i++) {
        const gender = seeded(i+1) > .47 ? "女" : "男";
        const allowance = ["1500元以下","1500-2500元","2501-3500元","3500元以上"][Math.min(3,Math.floor(seeded(i+6)*4))];
        const value = Math.min(5, Math.max(1, 2.7 + seeded(i+9)*2.1 + (gender==="女"?.15:0)));
        const quality = Math.min(5, Math.max(1, 2.5 + seeded(i+16)*2.4));
        const service = Math.min(5, Math.max(1, 2.4 + seeded(i+26)*2.5));
        const intent = Math.min(5, Math.max(1, .75 + value*.46 + quality*.28 + service*.14 + (seeded(i+31)-.5)*.8));
        const satisfaction = Math.min(5, Math.max(1, .45 + quality*.42 + service*.34 + (seeded(i+35)-.5)*.6));
        const priceSensitivity = Math.min(5, Math.max(1, 2.2 + seeded(i+42)*2.7));
        rows.push({
          "编号": `S${String(i+1).padStart(3,"0")}`, "性别": gender, "年龄": 18 + Math.floor(seeded(i+3)*7), "月生活费": allowance,
          "偏好品牌": brands[Math.floor(seeded(i+5)*brands.length)], "月均消费额": Math.round(35 + seeded(i+7)*180 + (allowance.includes("3500")?45:0)),
          "购买频次": 1 + Math.floor(seeded(i+8)*12), "感知价值1": value.toFixed(1), "感知价值2": Math.min(5,Math.max(1,value+(seeded(i+10)-.5)*.7)).toFixed(1),
          "感知价值3": Math.min(5,Math.max(1,value+(seeded(i+11)-.5)*.7)).toFixed(1), "产品品质": quality.toFixed(1), "服务体验": service.toFixed(1),
          "价格敏感度": priceSensitivity.toFixed(1), "满意度": satisfaction.toFixed(1), "购买意愿": intent.toFixed(1),
          "答题时长秒": Math.floor(85 + seeded(i+13)*390), "IP": `10.0.${Math.floor(i/50)}.${(i%50)+1}`,
          "开放意见": comments[Math.floor(seeded(i+15)*comments.length)]
        });
      }
      rows[18].IP = rows[17].IP; rows[42]["答题时长秒"] = 27; rows[77]["感知价值2"] = ""; rows[88]["满意度"] = "";
      return rows;
    }

    function analyzeTopic(topic) {
      const t = topic.trim() || defaultState.topic;
      const city = (t.match(/([^市省县区]{1,8}(?:市|省|县|区))/) || [])[1] || "目标区域";
      const objectMatch = t.match(/(大学生|消费者|用户|居民|游客|青年|老年人|企业|门店|顾客|职工|学生)/);
      const object = objectMatch ? objectMatch[1] : "目标人群";
      const subject = t.replace(/研究|调查|分析|影响因素|现状|及其|行为/g, "").replace(city, "").replace(object, "").slice(0, 14) || "研究主题";
      const broad = t.length < 8 || (!/市|省|县|区|高校|平台|行业/.test(t) && !/大学生|消费者|用户|居民|游客|青年|企业/.test(t));
      const cold = /极地|小众|罕见|冷门/.test(t);
      const variables = /消费|购买|品牌|产品/.test(t) ? ["感知价值", "产品品质", "价格敏感度", "满意度", "购买意愿"] : ["认知", "态度", "行为表现", "满意度", "持续意愿"];
      const scores = { access: cold ? 58 : 86, difficulty: /机制|路径|模型|因果/.test(t) ? 72 : 84, innovation: /数字|智能|新|绿色|短视频/.test(t) ? 88 : 76, utility: 87 };
      const total = Math.round(scores.access*.3 + scores.difficulty*.2 + scores.innovation*.2 + scores.utility*.3 - (broad?7:0));
      return {
        object, scene: city, subject, variables, goal: `识别${object}在${subject}方面的行为特征、差异与关键影响因素`, broad, cold, scores, total,
        background: `${city}${subject}相关消费与服务场景持续变化，${object}的决策机制呈现多因素共同作用特征。现有观察往往停留在现象描述层面，有必要结合问卷、行为与公开资料形成可验证的证据链。`,
        significance: `从理论层面补充特定场景下的行为机制解释；从实践层面为产品优化、用户运营与资源配置提供量化依据。`,
        questions: [`${object}当前的${subject}行为特征如何？`, `不同人口统计群体之间是否存在显著差异？`, `哪些因素显著影响满意度与持续意愿？`, `能否识别具有不同需求特征的细分群体？`, `本产品相对竞品应如何形成差异化策略？`]
      };
    }

        ["人口统计变量", "用于分群比较与控制偏差", "性别、年龄、教育、收入", "回答群体差异问题", "单选题", "名义/有序", "必需"],
        ["行为数据", "实际消费或使用记录", "频次、金额、复购次数", "校验态度与行为是否一致", "数值填空", "连续", "必需"],
        ["评论/舆情数据", "公开反馈与开放题文本", "评价、社交讨论、建议", "补充解释量化结果", "文本导入", "文本", "建议"],
        ["行业数据", "市场规模与环境证据", "规模、增速、政策", "支撑背景与外部效度", "二手资料", "连续/文本", "建议"],
        ["竞品数据", "产品和运营表现", "价格、评分、SKU、渠道", "回答竞争策略问题", "结构化录入", "连续", "建议"]

    const SCALE_LIBRARY = [
      {id:"satisfaction",name:"顾客满意度",citation:"Oliver, R. L. (1980). A cognitive model of satisfaction decisions. Journal of Marketing Research, 17(4), 460–469.",items:["总体而言，我对本次体验感到满意","实际体验达到了我的预期","如果重新选择，我仍会做出相似决定"]},

    function openScaleLibrary() { modal("常用量表库", `<div class="form-group"><label>搜索量表</label><input id="scaleSearch" type="search" placeholder="满意度、忠诚度、感知价值…"></div><div class="source-list" id="scaleLibraryList">${renderScaleLibraryRows(SCALE_LIBRARY)}</div>`);document.getElementById("scaleSearch")?.addEventListener("input",e=>{const q=e.target.value.trim();document.getElementById("scaleLibraryList").innerHTML=renderScaleLibraryRows(SCALE_LIBRARY.filter(scale=>scale.name.includes(q)||scale.items.some(item=>item.includes(q))));bindScaleLibraryButtons();icons();});bindScaleLibraryButtons(); }

    function openReverseScoring() { const cols=numericColumns();if(!dataReady()||!cols.length)return toast("请先导入包含量表列的数据");modal("反向计分", `<div class="form-group"><label>量表最高分</label><select id="reverseMax"><option value="5">5 分</option><option value="7">7 分</option></select></div><div class="source-list">${cols.map(col=>`<label class="source-item"><input class="reverse-col" type="checkbox" value="${esc(col)}"><div><strong>${esc(col)}</strong><p>生成 ${esc(col)}_反向，保留原始列</p></div></label>`).join("")}</div><button class="btn btn-primary" id="applyReverse" style="margin-top:12px"><i data-lucide="refresh-cw"></i>生成反向变量</button>`);document.getElementById("applyReverse")?.addEventListener("click",()=>{const selected=[...document.querySelectorAll(".reverse-col:checked")].map(input=>input.value),max=Number(document.getElementById("reverseMax").value);if(!selected.length)return toast("请至少选择一列");state.data.forEach(row=>selected.forEach(col=>{const value=num(row[col]);row[`${col}_反向`]=Number.isFinite(value)?max+1-value:"";}));state.cleanedData=[];inferTypes(state.data);state.dataHealth=assessDataHealth(state.data);recordVersion("反向计分",`${selected.join("、")} · ${max}分量表`,{selected,max});closeModal();renderPage();toast("反向变量已生成");}); }

    function generateQuestionnaire() {
      const a = state.topicAnalysis || analyzeTopic(state.topic);
      const variables = a.variables;
      const qs = [
        { type:"单选题", text:"您的性别是？", options:"男 / 女 / 其他 / 不便透露", dimension:"人口统计", required:true },
        { type:"数值题", text:"您的年龄是？", options:"请输入周岁", dimension:"人口统计", required:true },
        { type:"单选题", text:"您的月可支配生活费大约是？", options:"1500元以下 / 1500—2500元 / 2501—3500元 / 3500元以上", dimension:"人口统计", required:true },
        { type:"频次题", text:`过去一个月，您接触或购买${a.subject}相关产品的次数是？`, options:"0次 / 1—2次 / 3—5次 / 6—10次 / 10次以上", dimension:"行为", required:true }
      ];
      variables.forEach((v,vi)=>{
        const stems = vi===0?[`我认为相关产品提供了与价格相匹配的价值`,`与同类选择相比，该产品对我有吸引力`,`总体而言，选择该产品是值得的`]:vi===1?[`相关产品的整体品质符合我的预期`,`相关产品的表现稳定可靠`,`我认可相关产品所提供的核心体验`]:vi===2?[`价格变化会明显影响我的选择`,`我会主动比较不同品牌的价格`,`促销活动会提高我的购买可能性`]:vi===3?[`总体而言，我对本次体验感到满意`,`实际体验基本达到我的预期`,`如果重新选择，我仍会做出相似决定`]:[`未来我愿意继续选择相关产品`,`我愿意向他人推荐相关产品`,`在条件相近时，我会优先选择该产品`];
        stems.forEach((text,i)=>qs.push({type:"5点量表",text,options:"1 非常不同意 — 5 非常同意",dimension:v,required:true,reverse:vi===2&&i===0}));
      });
      qs.push({type:"开放题",text:"您认为该产品或服务最需要改进的方面是什么？",options:"自由填写",dimension:"质性补充",required:false});
      state.questionnaire = qs; saveState(); return qs;
    }

        <div class="split">

    function runQuality() {
      const rows = state.data; if (!rows.length) return null;
      const durationCol = state.columns.find(c=>/时长|duration|秒/i.test(c));
      const ipCol = state.columns.find(c=>/^ip$|IP|地址/i.test(c));
      const ipCount = {}; if(ipCol) rows.forEach(r=>ipCount[r[ipCol]]=(ipCount[r[ipCol]]||0)+1);
      const results = rows.map((r,i)=>{
        const filled = state.columns.filter(c=>r[c]!==""&&r[c]!=null).length / Math.max(1,state.columns.length);
        const numericVals = state.columns.filter(c=>state.variableTypes[c]==="有序").map(c=>num(r[c])).filter(Number.isFinite);
        let straight = false; if(numericVals.length>=5){const counts={};numericVals.forEach(v=>counts[v]=(counts[v]||0)+1);straight=Math.max(...Object.values(counts))/numericVals.length>.8;}
        const short = durationCol ? (num(r[durationCol])||0) < 60 : false;
        const duplicate = ipCol ? ipCount[r[ipCol]] > 1 : false;
        const completeness = Math.round(filled*30), logic = straight?12:30, time = short?5:20, ip = duplicate?5:20;
        const score = completeness+logic+time+ip;
        return { index:i+1, score, completeness, logic, time, ip, reasons:[filled<.8?"缺失较多":"",straight?"疑似连续同选项":"",short?"作答过快":"",duplicate?"IP 重复":""].filter(Boolean) };
      });
      const low=results.filter(r=>r.score<60); const avg=mean(results.map(r=>r.score));
      state.qualityResult={results,low,avg,durationCol,ipCol}; state.results.quality={n:rows.length,excluded:low.length,avg}; saveState(); return state.qualityResult;
    }

    function cleaningDiagnostics() {
      const rows=state.data||[], cols=state.columns||[], missing=cols.map(col=>({col,count:rows.filter(row=>row[col]===""||row[col]==null).length})).filter(x=>x.count>0);
      const numeric=cols.filter(col=>rows.filter(row=>num(row[col])!==null).length>=Math.max(3,rows.length*.75)),outliers=[];
      numeric.forEach(col=>{const values=rows.map(row=>num(row[col])).filter(Number.isFinite);if(values.length<5)return;const q1=quantile(values,.25),q3=quantile(values,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr,count=values.filter(value=>value<lo||value>hi).length;if(count)outliers.push({col,count,range:`< ${fmt(lo,2)} 或 > ${fmt(hi,2)}`});});
      const seen=new Set();let duplicates=0;rows.forEach(row=>{const key=JSON.stringify(cols.map(col=>row[col]));if(seen.has(key))duplicates++;else seen.add(key);});return{missing,outliers,duplicates};
    }

        ${valueNote("逐份问卷评分与可追溯剔除清单，能把“我们清洗过数据”升级为可展示、可审计的质量证据。")}`;
    }

    function describe(column) {
      const vals=valuesOf(column), n=vals.length, m=mean(vals), s=sd(vals), med=median(vals), q1=quantile(vals,.25), q3=quantile(vals,.75);
      const skew=n>2 ? vals.reduce((a,x)=>a+((x-m)/s)**3,0)*n/((n-1)*(n-2)) : NaN;
      const kurt=n>3 ? (n*(n+1)/((n-1)*(n-2)*(n-3))*vals.reduce((a,x)=>a+((x-m)/s)**4,0) - 3*(n-1)**2/((n-2)*(n-3))) : NaN;
      const counts={}; vals.forEach(v=>counts[v]=(counts[v]||0)+1); const mode=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
      return { vals,n,m,s,med,q1,q3,min:Math.min(...vals),max:Math.max(...vals),variance:s*s,skew,kurt,mode };
    }

    function frequencyTable(column) {
      const vals=analysisData().map(r=>String(r[column]??"").trim()).filter(Boolean), counts={}; vals.forEach(v=>counts[v]=(counts[v]||0)+1);
      let cum=0; return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([label,count])=>{const pct=count/vals.length*100;cum+=pct;return{label,count,pct,cum};});
    }

    function ranks(values) {
      const indexed=values.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v), out=Array(values.length); let i=0;
      while(i<indexed.length){let j=i;while(j+1<indexed.length&&indexed[j+1].v===indexed[i].v)j++;const rank=(i+j+2)/2;for(let k=i;k<=j;k++)out[indexed[k].i]=rank;i=j+1;} return out;

    function jarqueBera(values) { const v=values.filter(Number.isFinite),n=v.length;if(n<8)return{stat:NaN,p:NaN,n,status:"样本不足"};const m=mean(v),s=sd(v);if(!s)return{stat:Infinity,p:0,n,status:"常量"};const skew=v.reduce((sum,x)=>sum+((x-m)/s)**3,0)/n,kurt=v.reduce((sum,x)=>sum+((x-m)/s)**4,0)/n,jb=n/6*(skew**2+(kurt-3)**2/4),p=1-jStat.chisquare.cdf(jb,2);return{stat:jb,p,n,skew,kurt,status:p>=.05?"未发现显著偏离":"偏离正态"}; }

    function mineText(texts, topicCount = 4) {
      const domain=["价格","品质","口味","服务","创新","门店","包装","健康","优惠","排队","配送","体验","满意","推荐","选择","品牌","新品","甜度","方便","稳定"];
      const counts={};texts.forEach(text=>{const t=String(text);domain.forEach(w=>{const n=t.split(w).length-1;if(n)counts[w]=(counts[w]||0)+n;});const chunks=t.match(/[\u4e00-\u9fa5]{2,4}/g)||[];chunks.forEach(w=>{if(w.length===2&&!STOPWORDS.has(w))counts[w]=(counts[w]||0)+1;});});
      const words=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,30);
      let positive=0,negative=0,neutral=0;const coded=texts.map(text=>{let score=0;SENTIMENT.positive.forEach(w=>{if(String(text).includes(w))score++;});SENTIMENT.negative.forEach(w=>{if(String(text).includes(w))score--;});if(score>0)positive++;else if(score<0)negative++;else neutral++;return{text:String(text),sentiment:score>0?"正向":score<0?"负向":"中性",score};});

    }

          `放大${a.strengths[0]?.[1]||"核心体验"}优势，将其转化为一句可验证的价值主张。`,
          `优先补齐${a.weaknesses[0]?.[1]||"渠道覆盖"}短板，设定季度量化改善指标。`,
          `围绕“${a.strengths.slice(0,2).map(x=>x[1]).join(" + ")||"价值 + 体验"}”建立组合差异，而非单点价格竞争。`,
          `对${c.names[a.totals.indexOf(Math.max(...a.totals))]}进行月度标杆跟踪，记录价格、口碑和新品节奏。`
        ].map((x,i)=>`<div class="timeline-item"><strong>策略 ${i+1}</strong><p>${esc(x)}</p></div>`).join("")}</div></div></section></div>
        ${valueNote("竞品模块把评分矩阵、权重和策略建议完整连起来，能直观看到“数据如何支持决策”。")}`;
    }

    function methodForHypothesis(text) {
      if(/中介|传导|机制/.test(text))return"中介效应分析";if(/调节|强化|弱化/.test(text))return"调节效应分析";if(/不同|差异/.test(text)&&/三|多个|群体|年级|收入/.test(text))return"单因素 ANOVA";if(/不同|差异/.test(text))return"t 检验 / ANOVA";if(/是否|独立|偏好/.test(text)&&/性别|类别/.test(text))return"卡方检验";if(/影响|正向|负向/.test(text))return"回归分析";if(/相关|关系/.test(text))return"相关分析";return"描述统计 / 探索分析";
    }

    function renderHypotheses() {
      return `${pageHead("10", "研究假设管理", "统一管理假设、匹配检验方法并记录支持状态，确保研究问题形成闭环。", `<button class="btn btn-primary" id="addHypothesis"><i data-lucide="plus"></i>新增假设</button>`)}
        ${insight("完成理论框架后建立，分析过程中持续更新", `当前共 ${state.hypotheses.length} 条假设，${state.hypotheses.filter(h=>h.status!=="待验证").length} 条已有判断。`)}
        <section class="panel"><div class="panel-header"><h2>假设验证表</h2><span class="tag">自动匹配方法</span></div><div class="panel-body"><div id="hypothesisList">${state.hypotheses.map((h,i)=>`<div class="hypothesis-row"><strong>${esc(h.id)}</strong><input class="hyp-text" data-i="${i}" value="${esc(h.text)}" aria-label="${esc(h.id)}内容"><select class="hyp-method" data-i="${i}"><option>${esc(h.method)}</option><option>相关分析</option><option>回归分析</option><option>t 检验 / ANOVA</option><option>卡方检验</option><option>中介效应分析</option><option>调节效应分析</option></select><select class="hyp-status" data-i="${i}"><option ${h.status==="待验证"?"selected":""}>待验证</option><option ${h.status==="支持"?"selected":""}>支持</option><option ${h.status==="部分支持"?"selected":""}>部分支持</option><option ${h.status==="不支持"?"selected":""}>不支持</option></select><button class="btn btn-icon btn-ghost hyp-delete" data-i="${i}" aria-label="删除 ${esc(h.id)}"><i data-lucide="trash-2"></i></button></div>`).join("")}</div><div class="callout" style="margin-top:16px;margin-bottom:0"><i data-lucide="link"></i><div><strong>闭环检查</strong><p>每条假设应对应理论依据、变量操作化、检验方法、统计结果和最终判断。状态只代表样本证据，不代表理论被永久证明。</p></div></div></div></section>
        ${valueNote("假设验证表让评委快速确认“提出的问题是否都被回答”，避免研究结尾出现逻辑断点。")}`;
    }

    function consistencyReport() {
      const issues=[],passed=[];const inf=state.results.inference,model=state.results.model,rel=state.results.reliability;
      if(inf&&model?.type==="多元线性回归"){
        const relevant=model.coef.find(c=>c.name===inf.v1||c.name===inf.v2);
        if(inf.significant&&relevant&&relevant.p>=.05)issues.push({level:"预警",title:"双变量显著但回归中不显著",detail:`${relevant.name} 在控制其他变量后 p=${pFmt(relevant.p)}。建议检查多重共线性、样本结构或中介关系。`});
        else passed.push("相关/差异结果与多元模型未发现直接冲突");
      } else issues.push({level:"提示",title:"尚未形成跨方法验证",detail:"至少完成一项假设检验和一项多元模型，才能检查控制变量前后的结论变化。"});
      if(rel){if(rel.alpha<.7)issues.push({level:"预警",title:"量表信度可能影响结论",detail:`Cronbach's α=${fmt(rel.alpha,3)}，建议修订题项后再解释回归或组间差异。`});else passed.push("量表信度达到常用的 0.70 标准");if(rel.firstPct>40)issues.push({level:"预警",title:"共同方法偏差风险",detail:`第一未旋转因子解释率 ${fmt(rel.firstPct,1)}%，超过 40% 经验阈值。`});else passed.push("共同方法偏差快速筛查未超过 40% 阈值");}
      const contradictory=state.hypotheses.filter(h=>h.status==="支持"&&!state.results.inference&&!state.results.model);if(contradictory.length)issues.push({level:"提示",title:"假设状态缺少已保存的分析证据",detail:`${contradictory.map(h=>h.id).join("、")} 已标为支持，但项目中尚未保存对应统计结果。`});
      return{issues,passed,time:new Date().toLocaleString("zh-CN")};
    }

    function renderConsistency() {
      const r=state.results.consistency;
      return `${pageHead("11", "结论一致性校验", "对照量表质量、单变量检验、多元模型与假设状态，发现可能矛盾和过度解释。", `<button class="btn btn-primary" id="runConsistency"><i data-lucide="scan-search"></i>开始校验</button>`)}
        ${insight("所有主要分析完成后、撰写结论之前", r?`已检查 ${r.issues.length+r.passed.length} 项，发现 ${r.issues.filter(x=>x.level==="预警").length} 个需要优先处理的风险。`:"系统只提示证据冲突，不会代替研究者做理论判断。")}
        <section class="panel"><div class="panel-header"><h2>校验报告</h2>${r?`<span class="tag">${esc(r.time)}</span>`:""}</div><div class="panel-body" id="consistencyResult">${r?renderConsistencyResult(r):`<div class="empty"><i data-lucide="scan-search"></i><h2>尚未运行校验</h2><p>建议先完成量表质量、假设检验与多元建模。</p></div>`}</div></section>
        ${valueNote("主动展示结论冲突和解释边界，体现研究者对稳健性、共线性和样本偏差的审慎处理。")}`;
    }

    function renderConsistencyResult(r) {
      return `${r.issues.map(x=>`<div class="callout ${x.level==="预警"?"warn":""}"><i data-lucide="${x.level==="预警"?"triangle-alert":"info"}"></i><div><strong>${esc(x.title)} <span class="tag ${x.level==="预警"?"bad":"blue"}">${x.level}</span></strong><p>${esc(x.detail)}</p></div></div>`).join("")}${r.passed.length?`<div class="mini-section"><h3>已通过检查</h3>${r.passed.map(x=>`<p style="color:var(--success)">✓ ${esc(x)}</p>`).join("")}</div>`:""}`;
    }

        <section class="panel" style="margin-bottom:16px"><div class="panel-header"><div><h2>报告章节编辑器</h2><p class="help" style="margin:3px 0 0">拖动章节可以调整导出顺序。</p></div><button class="btn btn-primary" id="saveReportDraft"><i data-lucide="save"></i>保存设置与章节</button></div><div class="panel-body"><div class="grid-2" id="reportEditorGrid">${sections.map((section,i)=>`<div class="form-group report-editor-card" draggable="true" data-section-id="${section.id}"><label><i data-lucide="grip-vertical"></i>${esc(section.title)}</label><textarea class="report-section-editor" data-section-id="${section.id}" data-index="${i}" style="min-height:125px">${esc(section.lines.join("\n\n"))}</textarea></div>`).join("")}</div></div></section>
        <div class="grid-3">
          <section class="panel"><div class="panel-body"><i data-lucide="file-text" style="color:var(--primary);width:28px"></i><h2 style="margin-top:10px">Word 分析报告</h2><p class="help">包含研究概述、数据质量、统计结果、假设验证、竞品与一致性结论。</p><button class="btn btn-primary export-action" data-type="word" style="width:100%"><i data-lucide="download"></i>导出 DOCX</button></div></section>

          <section class="panel"><div class="panel-body"><i data-lucide="printer" style="color:var(--blue);width:28px"></i><h2 style="margin-top:10px">可搜索文本 PDF</h2><p class="help">打开浏览器打印版，选择“另存为 PDF”，文本可复制和检索。</p><button class="btn export-action" data-type="print-report" style="width:100%"><i data-lucide="external-link"></i>打开打印版</button></div></section>

          <section class="panel"><div class="panel-body"><i data-lucide="sheet" style="color:var(--blue);width:28px"></i><h2 style="margin-top:10px">Excel 数据包</h2><p class="help">导出清洗后数据、变量字典、假设表和质控剔除清单。</p><button class="btn export-action" data-type="xlsx" style="width:100%"><i data-lucide="download"></i>导出 XLSX</button></div></section>
          <section class="panel"><div class="panel-body"><i data-lucide="braces" style="color:var(--success);width:28px"></i><h2 style="margin-top:10px">项目备份</h2><p class="help">保存为 JSON，保留选题、设置和已生成结果，便于本机恢复。</p><button class="btn export-action" data-type="json" style="width:100%"><i data-lucide="download"></i>导出 JSON</button></div></section>

    function defenseQuestions() {
      const topic=state.topic,a=state.topicAnalysis||analyzeTopic(topic),n=analysisData().length||"当前";
      return [
        ["为什么选择这个题目？",`该议题同时具有现实变化、明确对象和可测变量。我们聚焦${a.scene}的${a.object}，避免把结论外推到未覆盖人群。`],
        ["你的创新点在哪里？",`创新不只在方法，而在于把问卷、行为指标、文本反馈和竞品数据放入同一证据链，并进行结论一致性校验。`],
        ["样本量为什么足够？",`我们基于总体规模、95% 置信水平和允许误差进行事前估算，并结合分层配额检验样本结构；最终有效样本为 ${n} 份。`],
        ["样本具有代表性吗？",`我们通过分层配额控制关键人口特征，同时承认便利抽样可能带来的选择偏差，因此结论边界限定在实际覆盖人群。`],
        ["为什么使用这些统计方法？",`方法由变量类型和研究问题决定：群体差异使用 t/ANOVA，变量关系使用相关和回归，量表题先进行信效度检验。`],
        ["如何证明问卷可靠？",`我们报告 Cronbach's α、删除题项后的 α、KMO、Bartlett 和因子结构；不只给阈值，也检查题项是否符合理论维度。`],
        ["显著就代表影响很大吗？",`不代表。p 值反映样本证据强度，我们同时报告效应量、系数方向和置信信息，再判断实践意义。`],
        ["能否把回归结果解释为因果？",`不能直接解释为因果。横截面回归主要揭示控制其他变量后的条件相关，因果判断还需要时间顺序、实验或更强识别设计。`],
        ["如何处理低质量问卷？",`我们预设完整度、逻辑一致性、时长和重复记录规则，保留逐份评分与剔除清单，避免看到结果后再调整规则。`],
        ["文本情感分析可靠吗？",`词典法用于探索和发现线索，正式结论会抽样人工复核，并报告规则无法识别反讽、语境和新词的局限。`],
        ["竞品评分是否主观？",`评分来自统一维度和数据口径，权重透明可调；我们同时做敏感性分析，检查权重变化是否改变排序。`],
        ["研究最大的局限是什么？",`样本覆盖、共同方法偏差与横截面设计是主要局限。我们如实限定结论边界，并提出扩展地区、追踪研究和行为数据验证方案。`],
        ["如果重新做一次会改进什么？",`会先扩大预调研并精简交叉载荷题项，再引入多时点行为数据，进一步验证结论稳定性。`]
      ];
    }
